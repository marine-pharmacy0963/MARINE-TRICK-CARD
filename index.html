<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MARINE TRICK - Battle Demo</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef8ff;color:#123}
header{background:white;border-bottom:4px solid #1686c9;padding:12px;text-align:center;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:24px;color:#0878bd}.sub{font-size:12px;color:#567}
main{max-width:900px;margin:auto;padding:10px}.panel{background:#fff;border:2px solid #9fd8f5;border-radius:16px;padding:10px;margin-bottom:10px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:2px solid #88bfe0;border-radius:13px;padding:8px;background:#fff;min-height:145px}
.card.ko{opacity:.35}.name{font-weight:900;font-size:18px}.hp{font-weight:800}.bar{height:9px;background:#ddd;border-radius:8px;overflow:hidden;margin:5px 0}.fill{height:100%;background:#38a6dc}
button{border:0;border-radius:10px;padding:9px 10px;font-weight:800;font-size:14px;background:#1686c9;color:white;margin:3px}
button:disabled{opacity:.35}.attack{background:#e66b32}.combo{background:#8b61c2}.end{background:#34495e}.summon{background:#22a36a}.target{background:#d84b4b;width:100%}
.status{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:7px}.pill{background:#e9f7ff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
.log{background:#102b3a;color:#e9fbff;border-radius:12px;padding:9px;height:115px;overflow:auto;font-size:13px;line-height:1.5}
.hand{display:flex;gap:7px;flex-wrap:wrap}.hand button{background:#22a36a}.center{text-align:center}
.notice{background:#fff7cf;border:1px solid #efd35e;border-radius:10px;padding:7px;font-size:13px;margin-bottom:8px}
@media(max-width:620px){.row{grid-template-columns:repeat(3,1fr)}.card{padding:6px;min-height:135px}.name{font-size:14px}button{font-size:12px;padding:8px 6px}}
</style>
</head>
<body>
<header><h1>🌊 MARINE TRICK</h1><div class="sub">ルール確認用・CPU対戦デモ</div>
<div class="status"><span class="pill" id="turn"></span><span class="pill" id="phase"></span></div></header>
<main>
<div class="notice">双方とも最初は場0体。1ターンに召喚1体まで、攻撃1回まで。CPUも同じルールです。</div>

<section class="panel">
<b>🤖 CPUの場</b>
<div id="enemy" class="row"></div>
</section>

<section class="panel">
<b>🙂 あなたの場</b>
<div id="player" class="row"></div>
<div class="center" id="actions"></div>
</section>

<section class="panel">
<b>🃏 あなたの手札</b> <small>（1ターンに1体まで場に出せる）</small>
<div id="hand" class="hand"></div>
</section>

<section class="panel center">
<button class="end" onclick="endTurn()" id="endBtn">ターン終了</button>
<button onclick="resetGame()">最初から</button>
</section>

<section class="panel"><b>対戦ログ</b><div class="log" id="log"></div></section>
</main>

<script>
const templates=[
 {id:"A",name:"マロン",hp:120,atk:30,recoil:10},
 {id:"B",name:"ルウ",hp:120,atk:20,recoil:0},
 {id:"C",name:"タケシ",hp:120,atk:20,recoil:0},
 {id:"D",name:"ファマリン",hp:120,atk:20,recoil:0},
 {id:"E",name:"ボッシュ",hp:120,atk:20,recoil:0},
 {id:"F",name:"ノーティ",hp:120,atk:20,recoil:0}
];
let S,pending=null;
function clone(t,uid){return {...t,cur:t.hp,uid};}
function resetGame(){
 S={turn:"player",round:1,pSummoned:false,pAttacked:false,eSummoned:false,eAttacked:false,
    pBoard:[],eBoard:[],
    pHand:templates.slice(0,5).map((x,i)=>clone(x,"p"+i)),
    eHand:templates.slice(0,5).map((x,i)=>clone(x,"e"+i)),
    gameOver:false};
 pending=null; document.getElementById("log").innerHTML="";
 log("対戦開始！ 双方とも場は0体。あなたのターン！");
 render();
}
function alive(board){return board.filter(c=>c.cur>0)}
function log(s){let e=document.getElementById("log");e.innerHTML+=s+"<br>";e.scrollTop=e.scrollHeight}
function hpbar(c){let pct=Math.max(0,Math.round(c.cur/c.hp*100));return `<div class="bar"><div class="fill" style="width:${pct}%"></div></div>`}
function cardHTML(c,enemy){
 if(!c)return `<div class="card" style="opacity:.35"><div class="name">空き</div><br>キャラを出せます</div>`;
 let target = enemy && S.turn==="player" && pending && c.cur>0 ? `<button class="target" onclick="hitTarget('${c.uid}')">このキャラを攻撃</button>`:"";
 return `<div class="card ${c.cur<=0?"ko":""}"><div class="name">${c.name}</div><div class="hp">HP ${Math.max(0,c.cur)}/${c.hp}</div>${hpbar(c)}
 <div>通常 ${c.atk}${c.recoil?`<br><small>反動${c.recoil}</small>`:""}</div>${target}</div>`;
}
function renderBoard(id,board,enemy){
 let slots=[];for(let i=0;i<3;i++)slots.push(cardHTML(board[i],enemy));
 document.getElementById(id).innerHTML=slots.join("");
}
function render(){
 renderBoard("enemy",S.eBoard,true);renderBoard("player",S.pBoard,false);
 document.getElementById("turn").textContent=S.turn==="player"?"あなたのターン":"CPUのターン";
 document.getElementById("phase").textContent=`第${S.round}ターン`;
 let hand=document.getElementById("hand");
 hand.innerHTML=S.pHand.length?S.pHand.map(c=>`<button class="summon" ${S.turn!=="player"||S.pSummoned||S.pBoard.length>=3||S.gameOver?"disabled":""} onclick="summonPlayer('${c.uid}')">${c.name}を出す</button>`).join(""):"手札なし";
 let a=document.getElementById("actions");
 let ab=alive(S.pBoard);
 let html="";
 if(S.turn==="player"&&!S.gameOver&&!S.pAttacked){
   ab.forEach(c=>html+=`<button class="attack" onclick="chooseAttack('${c.uid}')">${c.name}：通常攻撃</button>`);
   if(ab.length>=2)html+=`<button class="combo" onclick="chooseCombo(2)">2人技 60</button>`;
   if(ab.length>=3)html+=`<button class="combo" onclick="chooseCombo(3)">3人技 110</button>`;
 }
 if(pending)html+=`<div><b>攻撃を選択中：</b>${pending.label}　相手を選んで！ <button onclick="cancelAttack()">取消</button></div>`;
 a.innerHTML=html;
 document.getElementById("endBtn").disabled=S.turn!=="player"||S.gameOver;
}
function summonPlayer(uid){
 if(S.turn!=="player"||S.pSummoned||S.pBoard.length>=3)return;
 let i=S.pHand.findIndex(c=>c.uid===uid); if(i<0)return;
 let c=S.pHand.splice(i,1)[0];S.pBoard.push(c);S.pSummoned=true;log(`あなた：${c.name}を場に出した！`);render();
}
function chooseAttack(uid){
 if(S.pAttacked)return;let c=alive(S.pBoard).find(x=>x.uid===uid);if(!c)return;
 pending={type:"single",actor:c,damage:c.atk,label:`${c.name}の攻撃 ${c.atk}`};render();
}
function chooseCombo(n){
 if(S.pAttacked||alive(S.pBoard).length<n)return;
 pending={type:"combo",damage:n===2?60:110,label:`${n}人技 ${n===2?60:110}`};render();
}
function cancelAttack(){pending=null;render()}
function hitTarget(uid){
 if(S.turn!=="player"||S.pAttacked||!pending)return;
 let t=alive(S.eBoard).find(x=>x.uid===uid);if(!t)return;
 t.cur-=pending.damage;log(`あなた：${pending.label} → ${t.name}に${pending.damage}ダメージ！`);
 if(pending.type==="single"&&pending.actor.recoil){pending.actor.cur-=pending.actor.recoil;log(`${pending.actor.name}は反動で${pending.actor.recoil}ダメージ！`)}
 S.pAttacked=true;pending=null;cleanup();if(!checkWin())render();
}
function cleanup(){
 S.pBoard=S.pBoard.filter(c=>{if(c.cur<=0)log(`あなたの${c.name}は倒れた！`);return c.cur>0});
 S.eBoard=S.eBoard.filter(c=>{if(c.cur<=0)log(`CPUの${c.name}は倒れた！`);return c.cur>0});
}
function checkWin(){
 // Demo victory: if a side has exhausted all five characters.
 if(S.eBoard.length===0&&S.eHand.length===0){S.gameOver=true;log("🎉 あなたの勝ち！");render();return true}
 if(S.pBoard.length===0&&S.pHand.length===0){S.gameOver=true;log("💀 CPUの勝ち！");render();return true}
 return false;
}
function endTurn(){
 if(S.turn!=="player"||S.gameOver)return;
 pending=null;S.turn="cpu";render();setTimeout(cpuTurn,450);
}
function cpuTurn(){
 if(S.gameOver)return;
 S.eSummoned=false;S.eAttacked=false;
 // CPU may summon exactly one character, same as player.
 if(S.eBoard.length<3&&S.eHand.length){
   let c=S.eHand.shift();S.eBoard.push(c);S.eSummoned=true;log(`CPU：${c.name}を場に出した！`);
 }
 render();
 setTimeout(()=>{
   let attackers=alive(S.eBoard), targets=alive(S.pBoard);
   // CPU gets at most ONE attack action.
   if(attackers.length&&targets.length){
     let target=targets[Math.floor(Math.random()*targets.length)];
     let damage,label,actor=null;
     if(attackers.length>=3 && Math.random()<0.28){damage=110;label="3人技"}
     else if(attackers.length>=2 && Math.random()<0.48){damage=60;label="2人技"}
     else {actor=attackers[Math.floor(Math.random()*attackers.length)];damage=actor.atk;label=`${actor.name}の通常攻撃`}
     target.cur-=damage;S.eAttacked=true;log(`CPU：${label} → ${target.name}に${damage}ダメージ！`);
     if(actor&&actor.recoil){actor.cur-=actor.recoil;log(`CPUの${actor.name}は反動で${actor.recoil}ダメージ！`)}
     cleanup();if(checkWin())return;
   } else if(!targets.length){log("CPU：攻撃できる相手がいない。")}
   finishCpu();
 },650);
}
function finishCpu(){
 S.turn="player";S.round++;S.pSummoned=false;S.pAttacked=false;pending=null;log(`あなたのターン！`);render();
}
resetGame();
</script>
</body></html>
