<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MARINE TRICK</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eaf7ff;color:#123}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:4px solid #1686c9;text-align:center;padding:9px}
h1{margin:0;color:#0878bd;font-size:23px}.sub{font-size:11px;color:#567}.stats{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.pill{background:#e5f5ff;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:800}
main{max-width:900px;margin:auto;padding:8px}.panel{background:#fff;border:2px solid #9bd6f4;border-radius:15px;padding:9px;margin-bottom:8px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.slot{border:2px solid #8bc3e2;border-radius:12px;padding:7px;min-height:128px;background:#fff}
.empty{opacity:.35}.name{font-weight:900}.hp{font-size:12px;font-weight:800}.bar{height:8px;background:#ddd;border-radius:8px;overflow:hidden;margin:5px 0}.fill{height:100%;background:#35a5dc}
button{border:0;border-radius:9px;padding:8px;font-weight:800;margin:2px;background:#1686c9;color:#fff}button:disabled{opacity:.35}
.attack{background:#e66b32}.combo{background:#8056bd}.support{background:#1d9a70}.target{background:#d64c4c;width:100%}.end{background:#34495e}
.hand{display:flex;gap:5px;flex-wrap:wrap}.cardbtn{border:2px solid #7ebfe1;background:#f8fdff;color:#124;padding:8px;min-width:110px;text-align:left}
.cardbtn b{display:block}.comboCard{border-color:#9c78c9}.supportCard{border-color:#52ad8e}.charCard{border-color:#4ba8d7}
.log{height:120px;overflow:auto;background:#102b3a;color:#e9fbff;border-radius:10px;padding:8px;font-size:12px;line-height:1.5}
.center{text-align:center}.hint{background:#fff5c9;border:1px solid #e5cb57;border-radius:9px;padding:7px;font-size:12px;margin-bottom:7px}
@media(max-width:600px){.slot{min-height:120px;padding:5px}.name{font-size:13px}button{font-size:11px}.cardbtn{min-width:98px;font-size:11px}}
</style>
</head>
<body>
<header><h1>🌊 MARINE TRICK</h1><div class="sub">20枚デッキ・3体撃破ルール</div>
<div class="stats"><span class="pill" id="who"></span><span class="pill" id="round"></span><span class="pill" id="score"></span><span class="pill" id="counts"></span></div></header>
<main>
<div class="hint">先に相手キャラを3体倒した方が勝ち！ キャラは1ターン1体まで。攻撃は1ターン1回。合体技・サポートは手札のカードを使い、使用後は捨て札へ。</div>
<section class="panel"><b>🤖 CPUの場</b><div class="board" id="eb"></div></section>
<section class="panel"><b>🙂 あなたの場</b><div class="board" id="pb"></div><div class="center" id="attackButtons"></div></section>
<section class="panel"><b>🃏 あなたの手札</b><div class="hand" id="hand"></div></section>
<section class="panel center"><button class="end" id="end" onclick="endTurn()">ターン終了</button><button onclick="newGame()">最初から</button></section>
<section class="panel"><b>対戦ログ</b><div class="log" id="log"></div></section>
</main>
<script>
const chars=[
 {key:"A",name:"マロン",hp:120,atk:40,recoil:10},
 {key:"A",name:"マロン",hp:120,atk:40,recoil:10},
 {key:"B",name:"ルウ",hp:120,atk:30,recoil:0},
 {key:"B",name:"ルウ",hp:120,atk:30,recoil:0},
 {key:"C",name:"タケシ",hp:120,atk:20,recoil:0,heal:10},
 {key:"C",name:"タケシ",hp:120,atk:20,recoil:0,heal:10}
];
const combo=[
 {type:"combo",need:["A","B"],name:"A＋B 2人技",dmg:60},
 {type:"combo",need:["B","C"],name:"B＋C 2人技",dmg:60},
 {type:"combo",need:["A","C"],name:"A＋C 2人技",dmg:60},
 {type:"triple",need:["A","B","C"],name:"3人合体技",dmg:110},
 {type:"triple",need:["A","B","C"],name:"3人合体技",dmg:110}
];
const supports=[
 {type:"draw",name:"全力でいこう！",text:"+2ドロー"},
 {type:"draw",name:"全力でいこう！",text:"+2ドロー"},
 {type:"guard",name:"かばう！",text:"次に受ける攻撃の対象を変更",count:2},
 {type:"power",name:"パワーアップ！",text:"次の攻撃+10",count:2},
 {type:"heal",name:"いやしのしずく",text:"味方1体を20回復",count:2},
 {type:"defend",name:"守りを固めろ！",text:"次に受けるダメージ-20",count:1}
];
function expandSupport(){
 let a=[]; supports.forEach(x=>{let n=x.count||1;for(let i=0;i<n;i++)a.push({...x})});return a
}
function makeDeck(owner){
 let d=[...chars.map(x=>({type:"char",...x})),...combo.map(x=>({...x})),...expandSupport()];
 d=d.slice(0,20).map((x,i)=>({...x,id:owner+"_"+i+"_"+Math.random()}));
 for(let i=d.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
 return d;
}
let S,pending=null;
function L(s){let e=document.getElementById("log");e.innerHTML+=s+"<br>";e.scrollTop=e.scrollHeight}
function draw(side,n){for(let i=0;i<n;i++){if(side.deck.length)side.hand.push(side.deck.pop())}}
function newGame(){
 S={turn:"p",round:1,gameOver:false,pKO:0,eKO:0,
 p:{deck:makeDeck("p"),hand:[],board:[],discard:[],summoned:false,attacked:false,power:0,defend:0},
 e:{deck:makeDeck("e"),hand:[],board:[],discard:[],summoned:false,attacked:false,power:0,defend:0}};
 pending=null;document.getElementById("log").innerHTML="";draw(S.p,4);draw(S.e,4);L("対戦開始！ 初期手札4枚。");render();
}
function alive(b){return b.filter(x=>x.cur>0)}
function hasNeed(board,need){let keys=alive(board).map(x=>x.key);return need.every(k=>{let i=keys.indexOf(k);if(i<0)return false;keys.splice(i,1);return true})}
function hp(c){return `<div class="hp">HP ${Math.max(0,c.cur)}/${c.hp}</div><div class="bar"><div class="fill" style="width:${Math.max(0,c.cur/c.hp*100)}%"></div></div>`}
function slot(c,enemy){
 if(!c)return `<div class="slot empty"><b>空き</b></div>`;
 let t=enemy&&pending&&S.turn==="p"?`<button class="target" onclick="target('${c.uid}')">このキャラを攻撃</button>`:"";
 return `<div class="slot"><div class="name">${c.name}</div>${hp(c)}<small>通常 ${c.atk}${c.recoil?` / 反動${c.recoil}`:""}${c.heal?` / 自分+${c.heal}`:""}</small>${t}</div>`
}
function board(id,b,enemy){let a=[];for(let i=0;i<3;i++)a.push(slot(b[i],enemy));document.getElementById(id).innerHTML=a.join("")}
function render(){
 board("eb",S.e.board,true);board("pb",S.p.board,false);
 document.getElementById("who").textContent=S.turn==="p"?"あなたのターン":"CPUのターン";
 document.getElementById("round").textContent="第"+S.round+"ターン";
 document.getElementById("score").textContent=`撃破 あなた ${S.pKO}/3 ｜ CPU ${S.eKO}/3`;document.getElementById("counts").textContent=`山札 ${S.p.deck.length} / 捨て札 ${S.p.discard.length}`;
 document.getElementById("end").disabled=S.turn!=="p"||S.gameOver;
 let h=document.getElementById("hand");h.innerHTML="";
 S.p.hand.forEach(c=>{
   let dis=S.turn!=="p"||S.gameOver;
   if(c.type==="char")dis=dis||S.p.summoned||S.p.board.length>=3;
   if(c.type==="combo"||c.type==="triple")dis=dis||S.p.attacked||!hasNeed(S.p.board,c.need);
   let cls=c.type==="char"?"charCard":(c.type==="combo"||c.type==="triple"?"comboCard":"supportCard");
   let txt=c.type==="char"?`HP120 / 通常${c.atk}`:(c.dmg?`${c.dmg}ダメージ`:c.text);
   h.innerHTML+=`<button class="cardbtn ${cls}" ${dis?"disabled":""} onclick="playCard('${c.id}')"><b>${c.name}</b>${txt}</button>`;
 });
 let a=document.getElementById("attackButtons"),x="";
 if(S.turn==="p"&&!S.p.attacked&&!S.gameOver)alive(S.p.board).forEach(c=>x+=`<button class="attack" onclick="normal('${c.uid}')">${c.name} 通常攻撃</button>`);
 if(pending)x+=`<div><b>${pending.label}</b>：CPUの攻撃対象を選んで！ <button onclick="pending=null;render()">取消</button></div>`;
 a.innerHTML=x;
}
function playCard(id){
 let i=S.p.hand.findIndex(x=>x.id===id);if(i<0)return;let c=S.p.hand[i];
 if(c.type==="char"){if(S.p.summoned||S.p.board.length>=3)return;S.p.hand.splice(i,1);c.cur=c.hp;c.uid="pc"+Math.random();S.p.board.push(c);S.p.summoned=true;L(`あなた：${c.name}を場に出した。`)}
 else if(c.type==="combo"||c.type==="triple"){if(S.p.attacked||!hasNeed(S.p.board,c.need))return;pending={kind:"card",card:c,damage:c.dmg,label:c.name};}
 else if(c.type==="draw"){S.p.hand.splice(i,1);S.p.discard.push(c);draw(S.p,2);L("あなた：全力でいこう！ 山札から2枚引いた。")}
 else if(c.type==="power"){S.p.hand.splice(i,1);S.p.discard.push(c);S.p.power+=10;L("あなた：パワーアップ！ 次の攻撃+10。")}
 else if(c.type==="heal"){let t=alive(S.p.board).sort((a,b)=>a.cur-b.cur)[0];if(!t)return;S.p.hand.splice(i,1);S.p.discard.push(c);t.cur=Math.min(t.hp,t.cur+20);L(`あなた：いやしのしずく！ ${t.name}を20回復。`)}
 else if(c.type==="defend"){S.p.hand.splice(i,1);S.p.discard.push(c);S.p.defend=20;L("あなた：守りを固めろ！ 次に受けるダメージを20軽減。")}
 else if(c.type==="guard"){S.p.hand.splice(i,1);S.p.discard.push(c);L("あなた：かばう！ ※この試作ではCPUの攻撃対象を最もHPの高い味方へ変更。");S.p.guard=true}
 render();
}
function normal(uid){let c=alive(S.p.board).find(x=>x.uid===uid);if(!c||S.p.attacked)return;pending={kind:"normal",actor:c,damage:c.atk,label:`${c.name}の通常攻撃`};render()}
function target(uid){
 if(!pending)return;let t=alive(S.e.board).find(x=>x.uid===uid);if(!t)return;
 let dmg=pending.damage+S.p.power;S.p.power=0;t.cur-=dmg;L(`あなた：${pending.label} → ${t.name}に${dmg}ダメージ！`);
 if(pending.kind==="normal"){if(pending.actor.recoil){pending.actor.cur-=pending.actor.recoil;L(`${pending.actor.name}は反動${pending.actor.recoil}。`)}if(pending.actor.heal){pending.actor.cur=Math.min(pending.actor.hp,pending.actor.cur+pending.actor.heal);L(`${pending.actor.name}は${pending.actor.heal}回復。`)}}
 else {let i=S.p.hand.findIndex(x=>x.id===pending.card.id);if(i>=0)S.p.discard.push(S.p.hand.splice(i,1)[0])}
 S.p.attacked=true;pending=null;clean();render();
}
function clean(){
 let pDead=S.p.board.filter(x=>x.cur<=0), eDead=S.e.board.filter(x=>x.cur<=0);
 pDead.forEach(x=>{L(`あなたの${x.name}は倒れた！`);S.p.discard.push(x);S.eKO++});
 eDead.forEach(x=>{L(`CPUの${x.name}は倒れた！`);S.e.discard.push(x);S.pKO++});
 S.p.board=S.p.board.filter(x=>x.cur>0);S.e.board=S.e.board.filter(x=>x.cur>0);
 if(S.pKO>=3){S.gameOver=true;pending=null;L("🎉 3体撃破！ あなたの勝ち！")}
 else if(S.eKO>=3){S.gameOver=true;pending=null;L("💀 3体撃破されました。CPUの勝ち！")}
}
function endTurn(){if(S.turn!=="p"||S.gameOver)return;pending=null;S.turn="e";render();setTimeout(cpuTurn,400)}
function cpuTurn(){
 let e=S.e,p=S.p;e.summoned=false;e.attacked=false;draw(e,1);
 // CPU support: simple legal choices
 let d=e.hand.find(x=>x.type==="draw");if(d){e.hand.splice(e.hand.indexOf(d),1);e.discard.push(d);draw(e,2);L("CPU：全力でいこう！ 2枚ドロー。")}
 let heal=e.hand.find(x=>x.type==="heal");let hurt=alive(e.board).sort((a,b)=>a.cur-b.cur)[0];
 if(heal&&hurt&&hurt.cur<=80){e.hand.splice(e.hand.indexOf(heal),1);e.discard.push(heal);hurt.cur=Math.min(hurt.hp,hurt.cur+20);L(`CPU：いやしのしずく！ ${hurt.name}を20回復。`)}
 if(e.board.length<3){let c=e.hand.find(x=>x.type==="char");if(c){e.hand.splice(e.hand.indexOf(c),1);c.cur=c.hp;c.uid="ec"+Math.random();e.board.push(c);e.summoned=true;L(`CPU：${c.name}を場に出した。`)}}
 let targets=alive(p.board);
 if(targets.length){
   let legal=e.hand.filter(x=>(x.type==="combo"||x.type==="triple")&&hasNeed(e.board,x.need));
   let chosen=legal.sort((a,b)=>b.dmg-a.dmg)[0],dmg,lab,actor=null;
   if(chosen){dmg=chosen.dmg;lab=chosen.name;e.hand.splice(e.hand.indexOf(chosen),1);e.discard.push(chosen)}
   else {let at=alive(e.board);if(at.length){actor=at[Math.floor(Math.random()*at.length)];dmg=actor.atk;lab=`${actor.name}の通常攻撃`}}
   if(dmg){
     let t;
     if(p.guard){t=targets.sort((a,b)=>b.cur-a.cur)[0];p.guard=false;L("あなたの「かばう！」が発動！")}
     else t=targets[Math.floor(Math.random()*targets.length)];
     dmg=Math.max(0,dmg-p.defend);if(p.defend){L(`守りを固めろ！ ダメージを${p.defend}軽減。`);p.defend=0}
     t.cur-=dmg;L(`CPU：${lab} → ${t.name}に${dmg}ダメージ！`);
     if(actor&&actor.recoil){actor.cur-=actor.recoil;L(`CPUの${actor.name}は反動${actor.recoil}。`)}
     if(actor&&actor.heal)actor.cur=Math.min(actor.hp,actor.cur+actor.heal);
   }
 }
 clean();if(S.gameOver){render();return}
 S.turn="p";S.round++;S.p.summoned=false;S.p.attacked=false;draw(S.p,1);L("あなたのターン。1枚ドロー！");render();
}
newGame();
</script></body></html>
