<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MARINE TRICK CARD MASTER V4</title>
<style>
:root{--navy:#063b4d;--deep:#032b38;--aqua:#19c7b5;--sky:#55cbe9;--coral:#ff6b6b;--gold:#ffd166;--ink:#0a3040;--muted:#66818b;--line:#c7e5e8;--white:#fff;--shadow:0 12px 34px #002f3f25}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(155deg,#ecffff,#dff8fb 55%,#fff)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.gate>div,.panel{background:#fffffff2;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.gate>div{width:min(420px,100%);padding:28px;text-align:center}.gate input{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;text-align:center;font-size:22px;margin:12px 0}.brand{font-weight:1000;letter-spacing:.07em}.brand b{color:#078c91}.top{position:sticky;top:0;z-index:20;display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px max(10px,calc((100vw - 1250px)/2));background:#063b4df3;color:white}.grow{flex:1}.small{font-size:12px;opacity:.85}.primary,.secondary,.danger,.mini{border:0;border-radius:11px;padding:10px 13px;font-weight:850}.primary{background:linear-gradient(135deg,#087e8b,#1ebdab);color:white}.secondary{background:#e5f6f7;color:#174f5d}.danger{background:#ffe2e2;color:#9c2d2d}.mini{padding:7px 9px;background:#edf7f8;color:#1b5361}.tabs{display:flex;gap:7px;overflow:auto;padding:10px max(10px,calc((100vw - 1250px)/2));background:#dcf5f7;position:sticky;top:62px;z-index:19}.tabs button{border:0;border-radius:99px;padding:9px 13px;background:white;white-space:nowrap;font-weight:800}.tabs .on{background:var(--navy);color:#fff}.main{max-width:1250px;margin:auto;padding:12px}.panel{padding:16px;margin-bottom:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px}.field{display:grid;gap:4px}.field label{font-size:12px;font-weight:800;color:#55717c}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #b8dce0;border-radius:9px;background:white}.field textarea{min-height:70px}.cardEdit{border:1px solid var(--line);border-radius:15px;background:#fbffff;overflow:hidden;margin:9px 0;transition:.18s}.cardEdit.drag{outline:4px solid #19c7b544}.cardEdit summary{display:flex;align-items:center;gap:8px;padding:11px;font-weight:900;cursor:pointer;list-style:none}.cardEdit summary::-webkit-details-marker{display:none}.thumb{width:45px;height:60px;object-fit:cover;border-radius:7px;background:#dcecef}.body{padding:0 11px 13px}.chip{font-size:11px;background:#d9f3f0;border-radius:99px;padding:3px 7px}.sub{border:1px dashed #9ccbd0;border-radius:11px;padding:9px;margin:8px 0;background:white}.hint{font-size:12px;color:var(--muted);line-height:1.55}.notice{border-radius:11px;padding:10px;background:#fff4d8;border:1px solid #ffd277}.ok{color:#08745c;font-weight:850}.asset{display:flex;gap:12px;align-items:center}.asset img{width:90px;height:90px;object-fit:contain;border-radius:10px;background:#e9f5f6}.modal{position:fixed;inset:0;z-index:100;background:#002d3bd8;display:grid;place-items:center;padding:18px}.modal>div{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:20px;text-align:center}.modal a{display:block;text-decoration:none;margin:9px 0}.modal textarea{width:100%;height:180px}.progress{height:12px;background:#dbe8e9;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--aqua);transition:.2s}.storage{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.storage div{background:#effafa;border-radius:10px;padding:9px}@media(max-width:650px){.top{position:relative}.tabs{top:0}.main{padding:7px}.panel{padding:11px}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.toolbar>*{flex:1}.cardEdit summary{padding:9px}}
</style></head><body>
<section id="gate" class="gate"><div><div class="brand">MARINE TRICK <b>CARD</b></div><h1>MASTER V4</h1><p class="hint">新規保存設計版</p><input id="password" type="password" inputmode="numeric"><button id="login" class="primary">管理画面を開く</button><p id="gateMsg" class="hint"></p></div></section>
<section id="app" class="hide"><header class="top"><div><div class="brand">MARINE TRICK <b>CARD</b></div><div id="saveStatus" class="small">読み込み中</div></div><span class="grow"></span><button id="saveNow" class="secondary">手動保存</button><button id="buildPublic" class="primary">PUBLIC生成</button></header><nav id="tabs" class="tabs"></nav><main id="main" class="main"></main></section><input id="jsonPicker" type="file" accept=".json,application/json" class="hide"><div id="modal" class="modal hide"></div>
<script>
(()=>{'use strict';
const ADMIN_PASSWORD='3103',DB_NAME='marine_trick_card_master_v4',DB_VERSION=1,PROJECT_ID='main',SCHEMA=4;
const DEFAULT_RULES={deckSize:20,initialHand:4,fieldSlots:3,winKO:3,drawPerTurn:1,summonsPerTurn:1,attacksPerTurn:1,supportsPerTurn:1,firstTurnAttackOff:true,affinityEnabled:false,affinityMode:'add',advantageAdd:10,disadvantageAdd:0,advantageMultiplier:1,disadvantageMultiplier:1,roundUnit:10,roundMode:'nearest',publicImageMax:900,publicImageQuality:.78};
const EFFECTS=[['draw','ドロー'],['heal','単体回復'],['healAll','全体回復'],['attackUp','攻撃力アップ'],['reduce','ダメージ軽減'],['guard','攻撃対象変更・かばう'],['counter','反撃'],['extraAttack','追加攻撃'],['multiAttack','連続攻撃'],['attackLock','攻撃禁止'],['recoil','反動ダメージ'],['randomRecoil','ランダム反動'],['randomHeal','ランダム回復'],['aoe','全体攻撃'],['dot','継続ダメージ'],['hot','継続回復'],['status','状態異常'],['cleanse','状態異常解除'],['discard','手札破棄'],['recoverCard','カード回収'],['revive','蘇生'],['search','カードサーチ'],['swapHP','HP交換'],['equalizeHP','HP均等化'],['moveDamage','ダメージ移動'],['conditionalBoost','条件付きダメージ増加'],['rpsDamage','じゃんけん結果ダメージ']];
const TIMINGS=[['onPlay','カード使用時'],['onSummon','登場時'],['onAttack','通常攻撃時'],['onDamaged','攻撃を受けた時'],['onKO','KO時'],['turnStart','ターン開始時'],['turnEnd','ターン終了時'],['passive','常時']];
const CONDITIONS=[['always','常時'],['hpBelow','HP％以下'],['hpAbove','HP％以上'],['allyFieldCount','自分の場の人数'],['enemyFieldCount','相手の場の人数'],['handCount','手札枚数'],['hasAttribute','特定属性が存在'],['hasCharacter','特定キャラクターが存在'],['chance','確率％']];
const TARGETS=[['selfActive','使用者'],['comboUserRandom','合体参加者からランダム1体'],['allySingle','味方単体'],['allyAll','味方全体'],['enemySingle','敵単体'],['enemyAll','敵全体'],['selfPlayer','自分'],['enemyPlayer','相手'],['randomAlly','味方ランダム'],['randomEnemy','敵ランダム']];
const id=p=>p+'_'+crypto.getRandomValues(new Uint32Array(2)).join('_');const clone=x=>structuredClone(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cond=()=>({id:id('cond'),type:'always',value:0,param:''});const eff=(timing,target,type,value,duration=0)=>({id:id('effect'),timing,conditions:[cond()],target,type,value,duration,param:'',cost:'none'});
const card=(o)=>({id:o.id,kind:o.kind,status:'public',unlock:'initial',unlockCode:'',name:o.name,character:o.character||'',assetId:null,hp:o.hp||0,attack:o.attack||0,attribute:o.attribute||'none',affinity:true,slots:o.kind==='character'?1:0,limit:o.limit,levelUp:o.kind==='character',maxLevel:o.kind==='character'?3:1,effects:o.effects||[],branches:o.branches||[]});
const SEED_CARDS=[
card({id:'starter_marron',kind:'character',name:'マロン',character:'マロン',hp:120,attack:40,attribute:'rock',limit:2,effects:[eff('onAttack','selfActive','recoil',10)]}),
card({id:'starter_dai',kind:'character',name:'ダイくん',character:'ダイくん',hp:120,attack:30,attribute:'scissors',limit:2}),
card({id:'starter_anna',kind:'character',name:'アンナ',character:'アンナ',hp:120,attack:20,attribute:'paper',limit:2,effects:[eff('onAttack','randomAlly','heal',10)]}),
card({id:'starter_combo_rs',kind:'combo2',name:'グー＋チョキ合体技',limit:1,branches:[{id:id('branch'),characters:[],attributes:['rock','scissors'],any:false,damage:70,sacrifices:0,effects:[eff('onPlay','comboUserRandom','recoil',10)]}]}),
card({id:'starter_combo_rp',kind:'combo2',name:'グー＋パー合体技',limit:1,branches:[{id:id('branch'),characters:[],attributes:['rock','paper'],any:false,damage:60,sacrifices:0,effects:[]}]}),
card({id:'starter_combo_ps',kind:'combo2',name:'パー＋チョキ合体技',limit:1,branches:[{id:id('branch'),characters:[],attributes:['paper','scissors'],any:false,damage:50,sacrifices:0,effects:[eff('onPlay','comboUserRandom','heal',10)]}]}),
card({id:'starter_combo_rsp',kind:'combo3',name:'グー＋チョキ＋パー合体技',limit:1,branches:[{id:id('branch'),characters:[],attributes:['rock','scissors','paper'],any:false,damage:110,sacrifices:0,effects:[]}]}),
card({id:'starter_ocean_spa',kind:'support',name:'オーシャンスパ',limit:2,effects:[eff('onPlay','allySingle','heal',20)]}),
card({id:'starter_transition',kind:'support',name:'海流トランジション',limit:2,effects:[eff('onPlay','allySingle','guard',0,1)]}),
card({id:'starter_draw',kind:'support',name:'めぐる海流',limit:2,effects:[eff('onPlay','selfPlayer','draw',2)]}),
card({id:'starter_boost',kind:'support',name:'黒潮ブースト',limit:2,effects:[eff('onPlay','allySingle','attackUp',10,1)]}),
card({id:'starter_cushion',kind:'support',name:'クッションウェーブ',limit:2,effects:[eff('onPlay','allySingle','reduce',20,1)]})];
const STARTER={starter_marron:2,starter_dai:2,starter_anna:2,starter_combo_rs:1,starter_combo_rp:1,starter_combo_ps:1,starter_combo_rsp:1,starter_ocean_spa:2,starter_transition:2,starter_draw:2,starter_boost:2,starter_cushion:2};
let db,project,assets=new Map(),tab='cards',timer=0,editing=false;const $=q=>document.querySelector(q),main=$('#main');
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets',{keyPath:'id'});if(!d.objectStoreNames.contains('snapshots')){const s=d.createObjectStore('snapshots',{keyPath:'id'});s.createIndex('projectTime',['projectId','createdAt'])}};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function tx(names,mode='readonly'){return db.transaction(names,mode)}
async function loadProject(){db=await openDB();project=await req(tx(['projects']).objectStore('projects').get(PROJECT_ID));if(!project){project={id:PROJECT_ID,schema:SCHEMA,revision:0,updatedAt:null,rules:clone(DEFAULT_RULES),branding:{logoAssetId:null,backgroundAssetId:null},cards:clone(SEED_CARDS),starterDeck:clone(STARTER)};await commit('初期作成',false)}const all=await req(tx(['assets']).objectStore('assets').getAll());assets=new Map(all.map(a=>[a.id,a]))}
async function commit(reason='保存',snapshot=true){project.schema=SCHEMA;project.revision=(project.revision||0)+1;project.updatedAt=new Date().toISOString();const t=tx(['projects','snapshots'],'readwrite');t.objectStore('projects').put(clone(project));if(snapshot&&project.revision%10===0)t.objectStore('snapshots').put({id:id('snap'),projectId:PROJECT_ID,createdAt:project.updatedAt,reason,data:clone(project)});await new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});$('#saveStatus').textContent='保存済み '+new Date(project.updatedAt).toLocaleString('ja-JP')+' / rev.'+project.revision}
function dirty(){clearTimeout(timer);$('#saveStatus').textContent='変更あり（自動保存待ち）';timer=setTimeout(()=>commit('自動保存').catch(showError),600)}function showError(e){$('#saveStatus').textContent='保存失敗';showModal('<h2>保存できません</h2><p>'+esc(e?.message||e)+'</p><p>入力内容は画面内に残っています。完全JSONを作成して退避してください。</p><button class="primary" data-modal-action="backup">完全JSONを作成</button>')}
function nav(){const tabs=[['cards','カード'],['rules','ルール・属性'],['assets','ロゴ・背景'],['backup','保存・バックアップ'],['architecture','保存設計']];$('#tabs').innerHTML=tabs.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${n}</button>`).join('')}
function render(){if(editing)return;const open=[...document.querySelectorAll('details[open][data-card]')].map(x=>x.dataset.card);nav();({cards:renderCards,rules:renderRules,assets:renderAssets,backup:renderBackup,architecture:renderArchitecture}[tab]||renderCards)();open.forEach(i=>{const d=document.querySelector(`[data-card="${CSS.escape(i)}"]`);if(d)d.open=true})}
const sel=(label,key,val,opts)=>`<div class="field"><label>${label}</label><select data-key="${key}">${opts.map(([v,n])=>`<option value="${v}" ${String(v)===String(val)?'selected':''}>${n}</option>`).join('')}</select></div>`;
const fld=(label,key,val,type='text',step='')=>`<div class="field"><label>${label}</label><input data-key="${key}" type="${type}" ${step?`step="${step}"`:''} value="${esc(val)}"></div>`;
function renderCards(){main.innerHTML=`<section class="panel"><div class="toolbar"><h2>カード管理</h2><span class="grow"></span><button class="primary" data-action="addCard">＋カード追加</button></div><p class="hint">画像はIndexedDBへBlob保存します。カード設定には画像IDだけを保持します。</p>${project.cards.map(cardEditor).join('')}</section>`}
function cardEditor(c){const a=assets.get(c.assetId);return `<details class="cardEdit" data-card="${c.id}"><summary>${a?`<img class="thumb" src="${URL.createObjectURL(a.blob)}">`:'<span class="thumb"></span>'}<span>${esc(c.name||'名称未設定')}</span><span class="chip">${esc(c.kind)}</span><span class="chip">${esc(c.status)}</span></summary><div class="body"><div class="grid">${sel('種類','kind',c.kind,[['character','キャラクター'],['support','サポート'],['combo2','2人合体技'],['combo3','3人合体技']])}${sel('公開区分','status',c.status,[['public','公開'],['draft','試作'],['private','非公開']])}${fld('カード名','name',c.name)}${fld('キャラクター名','character',c.character)}${sel('属性','attribute',c.attribute,[['rock','✊'],['scissors','✌️'],['paper','✋'],['none','なし']])}${sel('属性相性を適用','affinity',c.affinity,[['true','ON'],['false','OFF']])}${fld('HP','hp',c.hp,'number',10)}${fld('通常攻撃力','attack',c.attack,'number',10)}${fld('必要枠','slots',c.slots,'number',1)}${fld('投入上限','limit',c.limit,'number',1)}${sel('レベルアップ','levelUp',c.levelUp,[['true','可'],['false','不可']])}${fld('最大レベル','maxLevel',c.maxLevel,'number',1)}${sel('解放','unlock',c.unlock,[['initial','最初から'],['code','コード入力']])}${fld('解放コード','unlockCode',c.unlockCode)}</div><div class="toolbar"><label class="mini">画像登録・差替<input hidden type="file" accept="image/*" data-card-image></label><span class="hint">この欄へ画像をドロップ可</span><button class="mini" data-action="deleteImage">画像削除</button><button class="mini" data-action="duplicate">複製</button><button class="mini" data-action="up">↑</button><button class="mini" data-action="down">↓</button><button class="danger" data-action="delete">削除</button></div><h3>共通効果</h3>${c.effects.map(effectEditor).join('')}<button class="mini" data-action="addEffect">＋効果</button>${c.kind.startsWith('combo')?`<h3>合体条件（上から優先）</h3>${c.branches.map(branchEditor).join('')}<button class="mini" data-action="addBranch">＋分岐</button>`:''}</div></details>`}
function effectEditor(e){return `<div class="sub" data-effect="${e.id}"><div class="grid">${sel('発動','timing',e.timing,TIMINGS)}${sel('対象','target',e.target,TARGETS)}${sel('効果','type',e.type,EFFECTS)}${fld('数値','value',e.value,'number',10)}${fld('継続ターン','duration',e.duration,'number',1)}${fld('パラメータ','param',e.param||'')}</div><p class="hint">条件はすべて成立時に発動</p>${e.conditions.map(k=>`<div class="sub grid" data-cond="${k.id}">${sel('条件','type',k.type,CONDITIONS)}${fld('値','value',k.value,'number',1)}${fld('条件パラメータ','param',k.param)}<button class="danger" data-action="deleteCond">条件削除</button></div>`).join('')}<div class="toolbar"><button class="mini" data-action="addCond">＋条件</button><button class="mini" data-action="effectUp">効果↑</button><button class="mini" data-action="effectDown">効果↓</button><button class="danger" data-action="deleteEffect">効果削除</button></div></div>`}
function branchEditor(b){return `<div class="sub" data-branch="${b.id}"><div class="grid">${fld('必要キャラクター（,区切り）','characters',(b.characters||[]).join(','))}${fld('必要属性（rock等 ,区切り）','attributes',(b.attributes||[]).join(','))}${sel('誰でも可','any',b.any,[['true','はい'],['false','いいえ']])}${fld('ダメージ','damage',b.damage,'number',10)}${fld('生贄数','sacrifices',b.sacrifices,'number',1)}</div><h4>追加効果</h4>${b.effects.map(effectEditor).join('')}<div class="toolbar"><button class="mini" data-action="addBranchEffect">＋追加効果</button><button class="mini" data-action="branchUp">↑</button><button class="mini" data-action="branchDown">↓</button><button class="danger" data-action="deleteBranch">分岐削除</button></div></div>`}
function renderRules(){const r=project.rules;main.innerHTML=`<section class="panel"><h2>ゲームルール</h2><div class="grid">${fld('デッキ枚数','deckSize',r.deckSize,'number',1)}${fld('初期手札','initialHand',r.initialHand,'number',1)}${fld('場の最大枠','fieldSlots',r.fieldSlots,'number',1)}${fld('勝利KO数','winKO',r.winKO,'number',1)}${fld('ターンドロー','drawPerTurn',r.drawPerTurn,'number',1)}${fld('召喚上限','summonsPerTurn',r.summonsPerTurn,'number',1)}${fld('攻撃上限','attacksPerTurn',r.attacksPerTurn,'number',1)}${fld('サポート上限','supportsPerTurn',r.supportsPerTurn,'number',1)}${sel('先攻初回攻撃','firstTurnAttackOff',r.firstTurnAttackOff,[['true','禁止'],['false','許可']])}</div></section><section class="panel"><h2>属性相性</h2><div class="notice">初期状態はOFFです。方式と数値を決めるまでゲームへ適用されません。</div><div class="grid">${sel('全体設定','affinityEnabled',r.affinityEnabled,[['false','OFF'],['true','ON']])}${sel('補正方式','affinityMode',r.affinityMode,[['add','固定値加算'],['multiply','倍率']])}${fld('有利時の加算値','advantageAdd',r.advantageAdd,'number',10)}${fld('不利時の加算値','disadvantageAdd',r.disadvantageAdd,'number',10)}${fld('有利倍率','advantageMultiplier',r.advantageMultiplier,'number',.1)}${fld('不利倍率','disadvantageMultiplier',r.disadvantageMultiplier,'number',.1)}${fld('丸め単位','roundUnit',r.roundUnit,'number',10)}${sel('端数処理','roundMode',r.roundMode,[['nearest','四捨五入'],['floor','切り捨て'],['ceil','切り上げ']])}</div></section><section class="panel"><h2>PUBLIC画像</h2><div class="grid">${fld('最大解像度px','publicImageMax',r.publicImageMax,'number',50)}${fld('品質0～1','publicImageQuality',r.publicImageQuality,'number',.05)}</div></section>`}
function renderAssets(){main.innerHTML=`<section class="panel"><h2>ロゴ・背景</h2>${assetRow('ロゴ','logoAssetId')}${assetRow('背景','backgroundAssetId')}</section>`}function assetRow(label,key){const a=assets.get(project.branding[key]);return `<div class="asset sub" data-brand="${key}">${a?`<img src="${URL.createObjectURL(a.blob)}">`:'<span class="thumb"></span>'}<div><b>${label}</b><div class="toolbar"><label class="primary">登録・差替<input hidden type="file" accept="image/*" data-brand-image></label><button class="danger" data-action="deleteBrand">削除</button></div></div></div>`}
async function storageInfo(){if(!navigator.storage?.estimate)return null;const x=await navigator.storage.estimate();return {used:x.usage||0,quota:x.quota||0}}
async function renderBackup(){const s=await storageInfo();main.innerHTML=`<section class="panel"><h2>保存・バックアップ</h2><div class="storage"><div>方式<br><b>IndexedDB</b></div><div>改訂<br><b>${project.revision}</b></div><div>カード<br><b>${project.cards.length}</b></div><div>画像<br><b>${assets.size}</b></div>${s?`<div>使用量<br><b>${formatBytes(s.used)}</b></div><div>空き目安<br><b>${formatBytes(Math.max(0,s.quota-s.used))}</b></div>`:''}</div><div class="toolbar"><button class="primary" data-action="fullBackup">画像込み完全JSON</button><button class="secondary" data-action="importJSON">JSON読み込み</button><button class="secondary" data-action="requestPersist">永続保存を要求</button></div><p class="hint">完全JSONはカード設定・ルール・画像原本を1ファイルに保存します。読み込みは検証完了後に一括反映します。</p></section>`}
function renderArchitecture(){main.innerHTML=`<section class="panel"><h2>V4保存設計</h2><div class="grid"><div class="sub"><b>projects</b><p class="hint">カード、ルール、画像ID、改訂番号</p></div><div class="sub"><b>assets</b><p class="hint">画像原本をBlobで個別保存</p></div><div class="sub"><b>snapshots</b><p class="hint">10回ごとの復旧スナップショット</p></div><div class="sub"><b>PUBLIC</b><p class="hint">圧縮画像と公開データのみ</p></div></div><p class="ok">localStorageへ画像・MASTER本体は保存しません。</p></section>`}

.hand.splice(i,1);p.field.push(unit(c));p.summons++;apply(c.effects,'onSummon',p.field.at(-1),p,foe());fx('召喚');render();return}if(c.kind==='support'){if(p.supports>=R.supportsPerTurn)return;p.hand.splice(i,1);p.discard.push(c.id);p.supports++;apply(c.effects,'onPlay',null,p,foe());render();return}combo(i,c)}function branchOK(b,p,n){return p.field.length>=n&&(b.any||(b.characters.every(x=>p.field.some(u=>C.find(c=>c.id===u.cardId).character===x))&&b.attributes.every(x=>p.field.some(u=>u.attribute===x))))}function combo(i,c){const p=me(),n=c.kind==='combo3'?3:2,b=c.branches.find(x=>branchOK(x,p,n));if(!b)return;const users=[];b.attributes.forEach(x=>{const u=p.field.find(y=>y.attribute===x&&!users.includes(y));if(u)users.push(u)});p.field.forEach(u=>{if(users.length<n&&!users.includes(u))users.push(u)});p.hand.splice(i,1);p.discard.push(c.id);const t=foe().field.sort((x,y)=>x.hp-y.hp)[0];if(t)damage(t,b.damage,p,foe());apply(b.effects,'onPlay',users[0],p,foe(),users);p.attacks++;fx(c.kind==='combo3'?'3人合体技':'合体技');endCheck();render()}function attack(a,t){const p=me();if(p.attacks>=R.attacksPerTurn||(G.firstTurn&&G.turn===G.first&&R.firstTurnAttackOff))return;let n=a.attack+a.mods.filter(x=>x.type==='attackUp').reduce((s,x)=>s+x.value,0);n=affinity(n,a,t);p.attacks++;damage(t,n,p,foe(),a);apply(C.find(c=>c.id===a.cardId).effects,'onAttack',a,p,foe(),t);G.log.push(a.name+' '+n+'ダメージ');selected=null;fx('ATTACK');endCheck();render()}function affinity(n,a,t){if(!R.affinityEnabled||!C.find(c=>c.id===a.cardId).affinity)return n;const win=(a.attribute==='rock'&&t.attribute==='scissors')||(a.attribute==='scissors'&&t.attribute==='paper')||(a.attribute==='paper'&&t.attribute==='rock'),lose=(t.attribute==='rock'&&a.attribute==='scissors')||(t.attribute==='scissors'&&a.attribute==='paper')||(t.attribute==='paper'&&a.attribute==='rock');if(R.affinityMode==='add')n+=win?R.advantageAdd:lose?R.disadvantageAdd:0;else n*=win?R.advantageMultiplier:lose?R.disadvantageMultiplier:1;const u=R.roundUnit||1,z=n/u;return Math.max(0,(R.roundMode==='floor'?Math.floor(z):R.roundMode==='ceil'?Math.ceil(z):Math.round(z))*u)}function damage(t,n,ap,dp,src){const g=dp.field.find(u=>u!==t&&u.status.some(x=>x.type==='guard'));if(g)t=g;n=Math.max(0,n-t.mods.filter(x=>x.type==='reduce').reduce((s,x)=>s+x.value,0));t.hp-=n;if(t.hp<=0){dp.field.splice(dp.field.indexOf(t),1);dp.discard.push(t.cardId);ap.ko++;fx('KO')}}function targets(x,s,p,e,chosen){if(x.target==='selfActive')return s?[s]:[];if(x.target==='comboUserRandom')return[chosen[Math.floor(Math.random()*chosen.length)]].filter(Boolean);if(x.target==='allyAll')return p.field;if(x.target==='enemyAll')return e.field;if(x.target==='randomAlly')return[p.field[Math.floor(Math.random()*p.field.length)]].filter(Boolean);if(x.target==='randomEnemy')return[e.field[Math.floor(Math.random()*e.field.length)]].filter(Boolean);if(x.target==='allySingle')return[p.field.sort((a,b)=>a.hp-b.hp)[0]].filter(Boolean);if(x.target==='enemySingle')return[e.field.sort((a,b)=>a.hp-b.hp)[0]].filter(Boolean);return[]}function ok(cs,s,p,e){return cs.every(c=>c.type==='always'||c.type==='chance'&&Math.random()*100<c.value||c.type==='hpBelow'&&s&&s.hp/s.maxHp*100<=c.value||c.type==='hpAbove'&&s&&s.hp/s.maxHp*100>=c.value||c.type==='allyFieldCount'&&p.field.length>=c.value||c.type==='enemyFieldCount'&&e.field.length>=c.value||c.type==='handCount'&&p.hand.length>=c.value||c.type==='hasAttribute'&&p.field.some(u=>u.attribute===c.param)||c.type==='hasCharacter'&&p.field.some(u=>C.find(x=>x.id===u.cardId).character===c.param))}function apply(es,timing,s,p,e,chosen=[]){es.filter(x=>x.timing===timing&&ok(x.conditions,s,p,e)).forEach(x=>{const ts=targets(x,s,p,e,chosen),v=+x.value||0;if(x.type==='draw')draw(p,v);if(['heal','healAll','randomHeal'].includes(x.type))ts.forEach(u=>u.hp=Math.min(u.maxHp,u.hp+v));if(['attackUp','reduce'].includes(x.type))ts.forEach(u=>u.mods.push({type:x.type,value:v,left:x.duration||1}));if(['guard','counter','attackLoc );p.field.forEach(a=>e.field.forEach(t=>acts.push({t:'a',a,t,score:(a.attack>=t.hp?100:20)+(affinity(a.attack,a,t)>a.attack?25:0)-t.hp/20+Math.random()*8})));acts.sort((a,b)=>b.score-a.score);let x=G.diff==='EASY'?acts[Math.floor(Math.random()*acts.length)]:acts[0];if(x?.t==='p'){play(x.i);setTimeout(cpu,400)}else if(x?.t==='a'&&p.attacks<R.attacksPerTurn){attack(x.a,x.t);setTimeout(end,500)}else end()}function record(){const r=S.records;root.innerHTML=nav()+'<main class="wrap"><section class="box"><h2>戦績</h2><p>CPU '+r.cpu.w+'勝 '+r.cpu.l+'敗</p><p>EASY '+r.cpu.EASY.w+'-'+r.cpu.EASY.l+' / NORMAL '+r.cpu.NORMAL.w+'-'+r.cpu.NORMAL.l+' / HARD '+r.cpu.HARD.w+'-'+r.cpu.HARD.l+'</p><p>P1 '+r.local.p1+'勝 / P2 '+r.local.p2+'勝</p></section></main>'}function fx(t){const d=document.createElement('div');d.className='fx';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1000)}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v){view=b.dataset.v;render()}if(b.dataset.mode){if(!valid(S.decks['初期デッキ20枚']))return alert('初期デッキが成立していません');if(b.dataset.mode==='cpu'){modal.innerHTML='<div><h2>難易度</h2><button data-d="EASY">EASY</button><button data-d="NORMAL">NORMAL</button><button data-d="HARD">HARD</button></div>';modal.classList.remove('hide')}else start('local')}if(b.dataset.d){modal.classList.add('hide');start('cpu',b.dataset.d)}if(b.dataset.q){const c=C.find(x=>x.id===b.closest('[data-card]').dataset.card),d=window.editDeck,n=Math.max(0,Math.min(c.limit,(d[c.id]||0)+Number(b.dataset.q)));if(n)d[c.id]=n;else delete d[c.id];b.closest('[data-card]').querySelector('.qty b').textContent=n;count()}if(b.id==='sd'){if(!valid(window.editDeck))return alert('デッキ未成立');S.decks[document.getElementById('dn').value||'マイデッキ']=structuredClone(window.editDeck);save();alert('保存しました')}if(b.dataset.play!==undefined)play(Number(b.dataset.play));if(b.id==='end')end();if(b.id==='saveResume'){saveResume();alert('保存しました')}if(b.id==='accept'){doc
