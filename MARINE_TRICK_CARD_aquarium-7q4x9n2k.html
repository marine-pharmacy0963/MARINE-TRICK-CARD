<style>
:root{--sea:#073b4c;--deep:#062b3a;--aqua:#21d4c2;--sky:#4cc9f0;--coral:#ff6b6b;--gold:#ffd166;--ink:#092c3e;--paper:#f7ffff;--muted:#6d8792;--line:#cce8ec;--shadow:0 12px 34px #002b3b25}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#eaffff,#d9f6fb 50%,#fff);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.gate{min-height:100vh;display:grid;place-items:center;padding:22px}.gateBox,.panel{background:#ffffffed;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.gateBox{width:min(420px,100%);padding:28px;text-align:center}.brand{font-weight:1000;letter-spacing:.08em}.brand b{color:#078c91}.gate input{width:100%;padding:14px;border:2px solid var(--line);border-radius:13px;text-align:center;font-size:22px;margin:15px 0}.primary,.danger,.ghost,.mini{border:0;border-radius:12px;padding:11px 15px;font-weight:800}.primary{background:linear-gradient(135deg,#087f8c,#21bfae);color:#fff}.danger{background:#ffe3e3;color:#ad2d2d}.ghost{background:#e9f7f8;color:#15576a}.mini{padding:7px 10px;background:#edf7f8;color:#174f5e}.app{min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#073b4cf2;color:white;padding:12px max(14px,calc((100vw - 1280px)/2));display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top .spacer{flex:1}.top button{padding:8px 11px}.status{font-size:12px;opacity:.85}.tabs{display:flex;gap:7px;overflow:auto;padding:12px max(12px,calc((100vw - 1280px)/2));background:#dff7f8;position:sticky;top:58px;z-index:9}.tabs button{white-space:nowrap;border:0;border-radius:999px;background:#fff;padding:9px 14px;color:#245969;font-weight:800}.tabs button.on{background:var(--sea);color:white}.main{max-width:1280px;margin:auto;padding:14px}.panel{padding:18px;margin-bottom:14px}h2,h3{margin:.15em 0 .75em}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:800;color:#53717d}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #badce1;border-radius:10px;background:white}.field textarea{min-height:76px;resize:vertical}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.cards{display:grid;gap:12px}.editor{border:1px solid var(--line);border-radius:16px;background:#fbffff;overflow:hidden}.editor summary{list-style:none;display:flex;align-items:center;gap:9px;padding:13px;cursor:pointer;font-weight:900}.editor summary::-webkit-details-marker{display:none}.thumb{width:48px;height:64px;border-radius:8px;object-fit:cover;background:#dcecef}.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:#d8f4f1}.editorBody{padding:0 13px 14px}.sub{border:1px dashed #9ccdd2;padding:10px;border-radius:12px;margin:9px 0;background:white}.rowBtns{display:flex;gap:6px;flex-wrap:wrap}.hint{font-size:12px;color:var(--muted);line-height:1.6}.warn{background:#fff4db;border:1px solid #ffd67a;padding:11px;border-radius:11px;color:#744e00}.ok{color:#08775d;font-weight:800}.previewLogo{max-height:100px;max-width:260px;object-fit:contain}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:640px){.top{position:relative}.tabs{top:0}.main{padding:9px}.panel{padding:13px;border-radius:16px}.grid{grid-template-columns:1fr 1fr}.grid .wide{grid-column:1/-1}.toolbar button{flex:1}.editor summary{padding:10px}}
.editor{transition:.18s}.editor.dragover{border-color:var(--aqua);box-shadow:0 0 0 4px #21d4c244;background:#edfffc}.downloadReady{position:fixed;inset:0;z-index:99;background:#002b3bcf;display:grid;place-items:center;padding:18px}.downloadReady>div{width:min(430px,100%);background:#fff;border-radius:20px;padding:22px;text-align:center;box-shadow:var(--shadow)}.downloadReady a{display:block;text-decoration:none;margin:14px 0}

<section id="gate" class="gate"><div class="gateBox"><div class="brand">MARINE TRICK <b>CARD</b></div><h1>MASTER V2</h1><p class="hint">管理パスワードを入力してください。</p><input id="pw" type="password" inputmode="numeric" autocomplete="current-password"><button id="login" class="primary">管理画面を開く</button><p id="loginMsg" class="hint"></p></div></section>
<div id="app" class="app hidden"><header class="top"><div><div class="brand">MARINE TRICK <b>CARD</b></div><div class="status" id="saveState">未保存</div></div><div class="spacer"></div><button class="ghost" id="manualSave">手動保存</button><button class="primary" id="exportPublic">PUBLIC index.html 書き出し</button></header><nav class="tabs" id="tabs"></nav><main class="main" id="main"></main></div>
<input id="filePick" type="file" accept="application/json" class="hidden">
<script>
(()=>{'use strict';
const MASTER_STORAGE='mtc_master_v2_state'; const PASSWORD='3103';
const uid=(p='id')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=x=>JSON.parse(JSON.stringify(x)); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT_RULES={deckSize:20,initialHand:4,fieldSlots:3,winKO:3,summonsPerTurn:1,attacksPerTurn:1,supportsPerTurn:1,firstPlayerAttackLocked:true,drawPerTurn:1,typeBonus:1.5,typePenalty:.75,publicImageMax:900,publicImageQuality:.78};
const newEffect=()=>({id:uid('ef'),timing:'onPlay',conditions:[{type:'always',op:'>=',value:0,param:''}],target:'selfActive',type:'draw',value:1,duration:0,cost:'none'});
const sampleCards=[
{id:'starter_marron',kind:'character',status:'public',unlock:'initial',code:'',name:'マロン',character:'マロン',image:'',hp:120,attack:40,attribute:'rock',slots:1,limit:2,levelUp:true,maxLevel:3,effects:[{id:uid('ef'),timing:'onAttack',conditions:[{id:uid('co'),type:'always',value:0,param:''}],target:'selfActive',type:'recoil',value:10,duration:0,param:'',cost:'none'}],branches:[]},
{id:'starter_dai',kind:'character',status:'public',unlock:'initial',code:'',name:'ダイくん',character:'ダイくん',image:'',hp:120,attack:30,attribute:'scissors',slots:1,limit:2,levelUp:true,maxLevel:3,effects:[],branches:[]},
{id:'starter_anna',kind:'character',status:'public',unlock:'initial',code:'',name:'アンナ',character:'アンナ',image:'',hp:120,attack:20,attribute:'paper',slots:1,limit:2,levelUp:true,maxLevel:3,effects:[{id:uid('ef'),timing:'onAttack',conditions:[{id:uid('co'),type:'always',value:0,param:''}],target:'randomAlly',type:'heal',value:10,duration:0,param:'',cost:'none'}],branches:[]},
{id:'starter_combo_rs',kind:'combo2',status:'public',unlock:'initial',code:'',name:'グー＆チョキ合体技',character:'',image:'',hp:0,attack:0,attribute:'none',slots:0,limit:1,levelUp:false,maxLevel:1,effects:[],branches:[{id:uid('br'),characters:'',attributes:'rock,scissors',any:false,damage:70,effects:[{id:uid('ef'),timing:'onPlay',conditions:[{id:uid('co'),type:'always',value:0,param:''}],target:'comboUserRandom',type:'recoil',value:10,duration:0,param:'',cost:'none'}],sacrifices:0}]},
{id:'starter_combo_rp',kind:'combo2',status:'public',unlock:'initial',code:'',name:'グー＆パー合体技',character:'',image:'',hp:0,attack:0,attribute:'none',slots:0,limit:1,levelUp:false,maxLevel:1,effects:[],branches:[{id:uid('br'),characters:'',attributes:'rock,paper',any:false,damage:60,effects:[],sacrifices:0}]},
{id:'starter_combo_ps',kind:'combo2',status:'public',unlock:'initial',code:'',name:'パー＆チョキ合体技',character:'',image:'',hp:0,attack:0,attribute:'none',slots:0,limit:1,levelUp:false,maxLevel:1,effects:[],branches:[{id:uid('br'),characters:'',attributes:'paper,scissors',any:false,damage:50,effects:[{id:uid('ef'),timing:'onPlay',conditions:[{id:uid('co'),type:'always',value:0,param:''}],target:'comboUserRandom',type:'heal',value:10,duration:0,param:'',cost:'none'}],sacrifices:0}]},
{id:'starter_combo_rsp',kind:'combo3',status:'public',unlock:'initial',code:'',name:'グー＆チョキ＆パー合体技',character:'',image:'',hp:0,attack:0,attribute:'none',slots:0,limit:1,levelUp:false,maxLevel:1,effects:[],branches:[{id:uid('br'),characters:'',attributes:'rock,scissors,paper',any:false,damage:110,effects:[],sacrifices:0}]},
{id:'starter_ocean_spa',kind:'support',status:'public',unlock:'initial',code:'',name:'オーシャンスパ',character:'',image:'',hp:0,attack:0,attribute:'none',slots:0,limit:2,levelUp:false,maxLevel:1,effects:[{id:uid('ef'),timing:'onPlay',conditions:[{id:uid('co'),type:'always',value:0,param:''}],target:'allySingle',type:'heal',value:20,duration:0,param:'',cost:'discardSelf'}],branches:[]},
{id:'starter_transition',kind:'support',status:'public',unlock:'initial',code:'',name:'海流トランジション',character:'',image:'',hp:0,attack:0,attribute:'none',slots:0,limit:2,levelUp:false,maxLevel:1,effects:[{id:uid('ef'),timing:'onPlay',conditions:[{id:uid('co'),type:'always',value:0,param:''}],target:'allySingle',type:'guard',value:0,duration:1,param:'',cost:'discardSelf'}],branches:[]},
{id:'starter_draw',kind:'support',status:'public',unlock:'initial',code:'',name:'めぐる海流',character:'',image:'',hp:0,attack:0,attribute:'none',slots:0,limit:2,levelUp:false,maxLevel:1,effects:[{id:uid('ef'),timing:'onPlay',conditions:[{id:uid('co'),type:'always',value:0,param:''}],target:'selfPlayer',type:'draw',value:2,duration:0,param:'',cost:'discardSelf'}],branches:[]},
{id:'starter_boost',kind:'support',status:'public',unlock:'initial',code:'',name:'黒潮ブースト',character:'',image:'',hp:0,attack:0,attribute:'none',slots:0,limit:2,levelUp:false,maxLevel:1,effects:[{id:uid('ef'),timing:'onPlay',conditions:[{id:uid('co'),type:'always',value:0,param:''}],target:'allySingle',type:'attackUp',value:10,duration:1,param:'',cost:'discardSelf'}],branches:[]},
{id:'starter_cushion',kind:'support',status:'public',unlock:'initial',code:'',name:'クッションウェーブ',character:'',image:'',hp:0,attack:0,attribute:'none',slots:0,limit:2,levelUp:false,maxLevel:1,effects:[{id:uid('ef'),timing:'onPlay',conditions:[{id:uid('co'),type:'always',value:0,param:''}],target:'allySingle',type:'reduce',value:20,duration:1,param:'',cost:'discardSelf'}],branches:[]}
];
let state={schema:2,seedVersion:3,updatedAt:'',rules:clone(DEFAULT_RULES),branding:{logo:'',background:''},cards:sampleCards}; let tab='cards',saveTimer=0;
const $=q=>document.querySelector(q), main=$('#main');
function normalize(x){const s=x&&typeof x==='object'?x:{};s.schema=2;s.rules={...DEFAULT_RULES,...(s.rules||{})};s.branding={logo:'',background:'',...(s.branding||{})};s.cards=Array.isArray(s.cards)?s.cards:[];if((s.seedVersion||0)<3){const legacy=['c_fama','c_bosch','c_hermy','c_naughty','c_takeshi','c_marron','s_heal','s_wave','x_duo','x_trio'],imgs={};s.cards.filter(c=>legacy.includes(c.id)&&c.image).forEach(c=>imgs[c.name]=c.image);s.cards=s.cards.filter(c=>!legacy.includes(c.id));sampleCards.forEach(c=>{const i=s.cards.findIndex(x=>x.id===c.id),fresh={...clone(c),image:(i>=0?s.cards[i].image:imgs[c.name])||c.image};if(i<0)s.cards.push(fresh);else s.cards[i]=fresh});s.seedVersion=3}s.cards.forEach(c=>{c.effects=Array.isArray(c.effects)?c.effects:[];c.branches=Array.isArray(c.branches)?c.branches:[];});return s}
function load(){try{const raw=localStorage.getItem(MASTER_STORAGE);if(raw)state=normalize(JSON.parse(raw))}catch(e){alert('保存データを読み込めませんでした。初期状態で開始します。')}}
function save(show=false){state.updatedAt=new Date().toISOString();localStorage.setItem(MASTER_STORAGE,JSON.stringify(state));$('#saveState').textContent='保存済み '+new Date(state.updatedAt).toLocaleString('ja-JP');if(show)alert('MASTERを保存しました。')}
function dirty(){clearTimeout(saveTimer);$('#saveState').textContent='変更あり（自動保存待ち）';saveTimer=setTimeout(()=>save(false),700)}
const TABS=[['cards','カード'],['rules','ゲームルール'],['brand','画像・背景'],['backup','バックアップ'],['design','設計情報']];
function renderTabs(){ $('#tabs').innerHTML=TABS.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${n}</button>`).join(''); }
function field(label,key,val,type='text',extra=''){const step=type==='number'&&['attack','damage','value'].includes(key)?' step="10" min="0"':'';return `<div class="field ${extra}"><label>${label}</label><input data-key="${key}" type="${type}"${step} value="${esc(val)}"></div>`}
function select(label,key,val,opts){return `<div class="field"><label>${label}</label><select data-key="${key}">${opts.map(([v,n])=>`<option value="${v}" ${v===val?'selected':''}>${n}</option>`).join('')}</select></div>`}
function render(){const opened=[...document.querySelectorAll('details.editor[open]')].map(x=>x.dataset.id);renderTabs();if(tab==='cards')renderCards();if(tab==='rules')renderRules();if(tab==='brand')renderBrand();if(tab==='backup')renderBackup();if(tab==='design')renderDesign();opened.forEach(id=>{const d=document.querySelector(`details.editor[data-id="${CSS.escape(id)}"]`);if(d)d.open=true})}
function renderCards(){main.innerHTML=`<section class="panel"><h2>カード管理</h2><p class="hint">効果は共通エンジンで上から順に処理します。カード固有JavaScriptは生成されません。</p><div class="toolbar"><button class="primary" data-act="add">＋カード追加</button><span>${state.cards.length}枚（公開 ${state.cards.filter(c=>c.status==='public').length}枚）</span></div><div class="cards">${state.cards.map(cardEditor).join('')||'<div class="empty">カードがありません</div>'}</div></section>`}
function cardEditor(c,i){const kind={character:'キャラクター',support:'サポート',combo2:'2人合体',combo3:'3人合体'}[c.kind]||c.kind;return `<details class="editor" data-id="${c.id}"><summary><span>☰</span>${c.image?`<img class="thumb" src="${c.image}">`:'<span class="thumb"></span>'}<span>${esc(c.name||'名称未設定')}</span><span class="badge">${kind}</span><span class="badge">${esc(c.status)}</span></summary><div class="editorBody"><div class="grid">${select('種類','kind',c.kind,[['character','キャラクター'],['support','サポート'],['combo2','2人合体技'],['combo3','3人合体技']])}${select('公開区分','status',c.status,[['public','公開'],['draft','試作'],['private','非公開']])}${field('カード名','name',c.name)}${field('キャラクター名','character',c.character)}${select('属性','attribute',c.attribute,[['rock','✊'],['scissors','✌️'],['paper','✋'],['none','なし']])}${field('HP','hp',c.hp,'number')}${field('通常攻撃力','attack',c.attack,'number')}${field('必要枠','slots',c.slots,'number')}${field('投入上限','limit',c.limit,'number')}${select('レベルアップ','levelUp',String(!!c.levelUp),[['true','可'],['false','不可']])}${field('最大レベル','maxLevel',c.maxLevel,'number')}${select('解放方式','unlock',c.unlock,[['initial','最初から'],['code','コード入力']])}${field('解放コード','code',c.code)}</div><div class="toolbar"><label class="mini">画像登録/差替<input data-image="card" type="file" accept="image/*" hidden></label><button class="mini" data-act="removeImage">画像削除</button><button class="mini" data-act="duplicate">複製</button><button class="mini" data-act="up">↑</button><button class="mini" data-act="down">↓</button><button class="danger" data-act="delete">削除</button></div><h3>共通効果</h3><div>${c.effects.map((e,j)=>effectEditor(e,j)).join('')}</div><button class="mini" data-act="addEffect">＋効果追加</button>${c.kind.startsWith('combo')?`<h3>合体条件分岐（上から優先）</h3><div>${c.branches.map(branchEditor).join('')}</div><button class="mini" data-act="addBranch">＋条件分岐</button>`:''}</div></details>`}
const timings=[['onPlay','カード使用時'],['onSummon','登場時'],['onAttack','通常攻撃時'],['onDamaged','攻撃を受けた時'],['onKO','KO時'],['turnStart','ターン開始時'],['turnEnd','ターン終了時'],['passive','常時']];
const effectTypes=[['draw','ドロー'],['heal','単体回復'],['healAll','全体回復'],['attackUp','攻撃力アップ'],['reduce','ダメージ軽減'],['guard','かばう'],['counter','反撃'],['extraAttack','追加攻撃'],['multiAttack','連続攻撃'],['attackLock','攻撃禁止'],['recoil','反動ダメージ'],['randomRecoil','ランダム反動'],['randomHeal','ランダム回復'],['aoe','全体攻撃'],['dot','継続ダメージ'],['hot','継続回復'],['status','状態異常'],['cleanse','状態異常解除'],['discard','手札破棄'],['recoverCard','カード回収'],['revive','蘇生'],['search','カードサーチ'],['swapHP','HP交換'],['equalizeHP','HP均等化'],['moveDamage','ダメージ移動'],['conditionalBoost','条件付きダメージ増加'],['rpsDamage','じゃんけん結果ダメージ']];
const condTypes=[['always','常時'],['hpBelow','HP％以下'],['hpAbove','HP％以上'],['allyFieldCount','自分の場の人数'],['enemyFieldCount','相手の場の人数'],['handCount','手札枚数'],['hasAttribute','特定属性が存在'],['hasCharacter','特定キャラクターが存在'],['chance','確率％']];
const targets=[['selfActive','使用者'],['comboUserRandom','合体技使用者からランダム1体'],['allySingle','味方単体'],['allyAll','味方全体'],['enemySingle','敵単体'],['enemyAll','敵全体'],['selfPlayer','自分プレイヤー'],['enemyPlayer','相手プレイヤー'],['randomAlly','味方ランダム'],['randomEnemy','敵ランダム']];
function effectEditor(e,j){e.conditions=e.conditions?.length?e.conditions:[{id:uid('co'),type:'always',value:0,param:''}];return `<div class="sub" data-effect="${e.id}"><div class="grid">${select('発動','timing',e.timing,timings)}${select('対象','target',e.target,targets)}${select('効果種類','type',e.type,effectTypes)}${field('数値','value',e.value,'number')}${field('継続ターン','duration',e.duration,'number')}${field('効果パラメータ','param',e.param||'')}${select('消費条件','cost',e.cost,[['none','なし'],['discardSelf','自身を破棄'],['sacrifice1','味方1体'],['once','1回限り']])}</div><p class="hint">発動条件（すべて成立した時に発動）</p>${e.conditions.map(c=>`<div class="grid sub" data-condition="${c.id||(c.id=uid('co'))}">${select('条件','type',c.type,condTypes)}${field('条件値','value',c.value,'number')}${field('条件パラメータ','param',c.param)}<div class="rowBtns"><button class="mini" data-act="conditionUp">↑</button><button class="mini" data-act="conditionDown">↓</button><button class="danger" data-act="deleteCondition">削除</button></div></div>`).join('')}<div class="rowBtns"><button class="mini" data-act="addCondition">＋条件</button><button class="mini" data-act="effectUp">効果↑</button><button class="mini" data-act="effectDown">効果↓</button><button class="danger" data-act="deleteEffect">効果削除</button></div></div>`}
function branchEditor(b){return `<div class="sub" data-branch="${b.id}"><div class="grid">${field('必要キャラクター（カンマ区切り）','characters',b.characters)}${field('必要属性（rock等、カンマ区切り）','attributes',b.attributes)}${select('誰でも可','any',String(!!b.any),[['false','いいえ'],['true','はい']])}${field('ダメージ','damage',b.damage,'number')}${field('必要な生贄数','sacrifices',b.sacrifices,'number')}</div><p class="hint">追加効果</p>${(b.effects||[]).map(effectEditor).join('')}<div class="rowBtns"><button class="mini" data-act="addBranchEffect">＋追加効果</button><button class="mini" data-act="branchUp">↑</button><button class="mini" data-act="branchDown">↓</button><button class="danger" data-act="deleteBranch">分岐削除</button></div></div>`}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='login'){if($('#pw').value===PASSWORD){load();$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');render();save(false)}else $('#loginMsg').textContent='パスワードが違います。';return}if(b.id==='manualSave'){save(true);return}if(b.id==='exportPublic'){await exportPublic();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.removeBrand){state.branding[b.dataset.removeBrand]='';dirty();render();return}const a=b.dataset.act;if(!a)return;const c=getCard(b);if(a==='add'){state.cards.push({id:uid('c'),kind:'character',status:'draft',unlock:'initial',code:'',name:'新しいカード',character:'',image:'',hp:120,attack:30,attribute:'rock',slots:1,limit:3,levelUp:true,maxLevel:3,effects:[],branches:[]})}else if(a==='duplicate'&&c){const x=clone(c);x.id=uid('c');x.name+=' コピー';x.effects.forEach(z=>z.id=uid('ef'));x.branches.forEach(z=>z.id=uid('br'));state.cards.splice(state.cards.indexOf(c)+1,0,x)}else if(a==='delete'&&c){if(!confirm('このカードを削除しますか？'))return;state.cards.splice(state.cards.indexOf(c),1)}else if(a==='up'&&c)move(state.cards,state.cards.indexOf(c),-1);else if(a==='down'&&c)move(state.cards,state.cards.indexOf(c),1);else if(a==='removeImage'&&c)c.image='';else if(a==='addEffect'&&c)c.effects.push(newEffect());else if(a==='addBranch'&&c)c.branches.push({id:uid('br'),characters:'',attributes:'',any:true,damage:50,effects:[],sacrifices:0});else if(a==='jsonOut'){save();download('MARINE_TRICK_CARD_MASTER_V2_'+dateStamp()+'.json',JSON.stringify(state,null,2),'application/json');return}else if(a==='jsonIn'){$('#filePick').click();return}else if(a==='reset'){if(!confirm('MASTERデータを初期化しますか？'))return;state=normalize({rules:clone(DEFAULT_RULES),branding:{},cards:clone(sampleCards)});}else if(c){const ef=b.closest('[data-effect]');const br=b.closest('[data-branch]');if(ef){const arr=br?c.branches.find(x=>x.id===br.dataset.branch).effects:c.effects;const i=arr.findIndex(x=>x.id===ef.dataset.effect),x=arr[i],co=b.closest('[data-condition]');if(a==='deleteEffect')arr.splice(i,1);if(a==='effectUp')move(arr,i,-1);if(a==='effectDown')move(arr,i,1);if(a==='addCondition')x.conditions.push({id:uid('co'),type:'always',value:0,param:''});if(co){const ci=x.conditions.findIndex(z=>z.id===co.dataset.condition);if(a==='conditionUp')move(x.conditions,ci,-1);if(a==='conditionDown')move(x.conditions,ci,1);if(a==='deleteCondition'&&x.conditions.length>1)x.conditions.splice(ci,1)}}if(br){const i=c.branches.findIndex(x=>x.id===br.dataset.branch);if(a==='deleteBranch')c.branches.splice(i,1);if(a==='branchUp')move(c.branches,i,-1);if(a==='branchDown')move(c.branches,i,1);if(a==='addBranchEffect')c.branches[i].effects.push(newEffect())}}dirty();render()});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='filePick'&&t.files[0]){try{state=normalize(JSON.parse(await t.files[0].text()));save();render()}catch(x){alert('JSONを読み込めませんでした。')}t.value='';return}if(t.dataset.image==='card'&&t.files[0]){getCard(t).image=await fileData(t.files[0]);dirty();render();return}if(t.dataset.brand&&t.files[0]){state.branding[t.dataset.brand]=await fileData(t.files[0]);dirty();render();return}const key=t.dataset.key;if(!key)return;let val=t.type==='checkbox'?t.checked:(t.type==='number'?Number(t.value):t.value);const c=getCard(t);if(c){const ef=t.closest('[data-effect]'),br=t.closest('[data-branch]');if(ef){const arr=br?c.branches.find(x=>x.id===br.dataset.branch).effects:c.effects;const x=arr.find(x=>x.id===ef.dataset.effect),co=t.closest('[data-condition]');if(co)x.conditions.find(z=>z.id===co.dataset.condition)[key]=val;else x[key]=val}else if(br)c.branches.find(x=>x.id===br.dataset.branch)[key]=key==='any'?val==='true':val;else c[key]=key==='levelUp'?val==='true':val}else if(tab==='rules')state.rules[key]=val;dirty();if(c&&(key==='name'||key==='kind'||key==='status'))render()});
async function fileData(f){return new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}

async function compress(src,max,q){if(!src)return'';return new Promise(res=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(Math.max(w,h)>max){const z=max/Math.max(w,h);w=Math.round(w*z);h=Math.round(h*z)}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);res(cv.toDataURL('image/webp',q))};im.onerror=()=>res(src);im.src=src})}
function download(name,text,type='text/html'){document.querySelector('.downloadReady')?.remove();const url=URL.createObjectURL(new Blob([text],{type})),box=document.createElement('div');box.className='downloadReady';const inner=document.createElement('div'),title=document.createElement('h2'),note=document.createElement('p'),a=document.createElement('a'),close=document.createElement('button');title.textContent='書き出し準備完了';note.textContent='下のボタンを押して保存してください。Safariでも確実に保存できます。';a.className='primary';a.href=url;a.download=name;a.textContent=name+' を保存';close.className='ghost';close.textContent='閉じる';const clear=()=>{URL.revokeObjectURL(url);box.remove()};a.addEventListener('click',()=>setTimeout(clear,1500));close.addEventListener('click',clear);inner.append(title,note,a,close);box.append(inner);document.body.append(box)}function dateStamp(){return new Date().toISOString().replace(/[-:T]/g,'').slice(0,14)}

function recordView(){const x=store.records.cpu,l=store.records.local;root.innerHTML=nav()+'<main class="wrap"><section class="box"><h2>CPU戦績</h2><div class="record"><div>総試合 <b>'+x.total+'</b></div><div>勝 <b>'+x.w+'</b></div><div>負 <b>'+x.l+'</b></div><div>勝率 <b>'+(x.total?Math.round(x.w/x.total*100):0)+'%</b></div><div>現在連勝 <b>'+x.streak+'</b></div><div>最高連勝 <b>'+x.best+'</b></div>'+['EASY','NORMAL','HARD'].map(k=>'<div>'+k+' <b>'+x[k].w+'勝 '+x[k].l+'敗</b></div>').join('')+'</div></section><section class="box"><h2>2人対戦</h2><div class="record"><div>総試合 <b>'+l.total+'</b></div><div>P1勝利 <b>'+l.p1+'</b></div><div>P2勝利 <b>'+l.p2+'</b></div></div></section></main>'}
function chooseMode(mode){const decks=Object.keys(store.decks).filter(n=>deckValid(store.decks[n]));if(!decks.length){alert('成立した保存デッキが必要です。先にデッキを作成してください。');view='deck';render();return}const opts=decks.map(n=>'<option>'+esc(n)+'</option>').join('');show('<h2>'+(mode==='cpu'?'CPU対戦':'2人対戦')+'</h2><label>P1デッキ<select id="p1d">'+opts+'</select></label>'+(mode==='local'?'<label>P2デッキ<select id="p2d">'+opts+'</select></label>':'')+(mode==='cpu'?'<label>難易度<select id="diff"><option>EASY</option><option selected>NORMAL</option><option>HARD</option></select></label>':'')+'<button class="primary" id="start" data-mode="'+mode+'">対戦開始</button>')}
function deckValid(d){return Object.values(d).reduce((a,b)=>a+b,0)===R.deckSize&&Object.keys(d).some(k=>d[k]>0&&C.find(c=>c.id===k)?.kind==='character')}function makeDeck(d){let a=[];Object.entries(d).forEach(([k,n])=>{for(let i=0;i<n;i++)a.push(k)});return shuffle(a)}function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(mode,p1n,p2n,diff){const p1=player('P1',makeDeck(store.decks[p1n]));const p2=player(mode==='cpu'?'CPU':'P2',makeDeck(store.decks[p2n||p1n]));drawInitial(p1);drawInitial(p2);const first=Math.random()<.5?0:1;game={mode,diff,players:[p1,p2],turn:first,turnNo:1,first,firstTurn:true,log:[],winner:null,pending:null};view='battle';fx('対戦開始！');setTimeout(()=>{log(game.players[first].name+'が先攻！');if(mode==='local'){render();showPass()}else beginTurn()},700)}
function player(name,deck){return {name,deck,hand:[],field:[],discard:[],ko:0,summons:0,attacks:0,supports:0,status:[]}}function drawInitial(p){for(let i=0;i<R.initialHand;i++)draw(p,1);if(!p.hand.some(k=>C.find(c=>c.id===k)?.kind==='character')){const i=p.deck.findIndex(k=>C.find(c=>c.id===k)?.kind==='character');if(i>=0){p.deck.push(p.hand.pop());p.hand.push(p.deck.splice(i,1)[0])}}}function draw(p,n){while(n--&&p.deck.length)p.hand.push(p.deck.pop())}
function beginTurn(){const p=me();p.summons=p.attacks=p.supports=0;tick(p,'turnStart');draw(p,R.drawPerTurn);log(p.name+'のターン');saveResume();render();if(isCPU())setTimeout(cpuTurn,650)}function me(){return game.players[game.turn]}function foe(){return game.players[1-game.turn]}function isCPU(){return game.mode==='cpu'&&game.turn===1}
function battleView(){const a=me(),b=foe();root.innerHTML=nav()+'<main class="wrap"><section class="box"><div class="hud"><span class="turn">'+esc(a.name)+' TURN '+game.turnNo+'</span><span>先攻 '+game.players[game.first].name+'</span><span>KO '+game.players[0].ko+' - '+game.players[1].ko+'</span></div></section><section class="battle"><div class="side enemy"><h3>'+esc(b.name)+'　手札 '+b.hand.length+' / 山札 '+b.deck.length+'</h3>'+fieldHTML(b,true)+'</div><div class="side player"><h3>'+esc(a.name)+'　手札 '+a.hand.length+' / 山札 '+a.deck.length+'</h3>'+fieldHTML(a,false)+'<div class="hand">'+a.hand.map((k,i)=>handCard(k,i)).join('')+'</div></div></section><section class="box log">'+game.log.slice(-12).map(x=>'<div>'+esc(x)+'</div>').join('')+'</section><div class="actions"><button class="secondary" id="saveResume">途中セーブ</button><button class="primary" id="endTurn" '+(isCPU()?'disabled':'')+'>ターン終了</button></div></main>'}
function fieldHTML(p,enemy){let slots=[];for(let i=0;i<R.fieldSlots;i++){const u=p.field[i];slots.push(u?'<div class="unit '+(enemy?'enemyUnit':'')+'" data-unit="'+u.uid+'" data-owner="'+game.players.indexOf(p)+'">'+(u.image?'<img src="'+u.image+'">':'')+'<b>'+esc(u.name)+'</b><div class="hpnum">HP '+Math.max(0,u.hp)+' / '+u.maxHp+' Lv.'+u.level+'</div><div class="bar"><i style="width:'+Math.max(0,u.hp/u.maxHp*100)+'%"></i></div><small>'+attr(u.attribute)+' ATK '+attackValue(u)+'</small></div>':'<div class="unit"><span class="hint">空き</span></div>')}return '<div class="field">'+slots.join('')+'</div>'}
function handCard(k,i){const c=C.find(x=>x.id===k);return '<article class="card" data-hand="'+i+'">'+(c.image?'<img src="'+c.image+'">':'')+'<span class="kind">'+kind(c.kind)+'</span><h3>'+esc(c.name)+'</h3><small>'+attr(c.attribute)+' '+(c.kind==='character'?'HP '+c.hp+' / ATK '+c.attack:'')+'</small><button class="secondary" data-play="'+i+'">使う</button><button data-zoom="'+c.id+'">拡大</button></article>'}
function makeUnit(c){return {uid:id(),cardId:c.id,name:c.name,character:c.character,image:c.image,hp:c.hp,maxHp:c.hp,attack:c.attack,attribute:c.attribute,level:1,effects:copy(c.effects),mods:[],status:[]}}function fieldCost(p){return p.field.reduce((n,u)=>n+(C.find(c=>c.id===u.cardId)?.slots||1),0)}
function playCard(i,ai=false){const p=me(),c=C.find(x=>x.id===p.hand[i]);if(!c)return;if(c.kind==='character'){const same=p.field.find(u=>u.character&&u.character===c.character);if(same&&c.levelUp&&same.level<c.maxLevel){p.hand.splice(i,1);same.level++;same.maxHp+=Math.round(c.hp*.25);same.hp+=Math.round(c.hp*.25);same.attack+=Math.round(c.attack*.2);log(c.name+'がLv.'+same.level+'にレベルアップ！');fx('LEVEL UP!');trigger(same,'onSummon',p,foe());render();return}if(p.summons>=R.summonsPerTurn)return alert('このターンは召喚済みです。');if(fieldCost(p)+c.slots>R.fieldSlots)return alert('場の枠が足りません。');p.hand.splice(i,1);const u=makeUnit(c);p.field.push(u);p.summons++;log(c.name+'を召喚！');fx('召喚！');trigger(u,'onSummon',p,foe());render();return}if(c.kind==='support'){if(p.supports>=R.supportsPerTurn)return alert('このターンのサポート使用上限です。');p.hand.splice(i,1);p.discard.push(c.id);p.supports++;applyEffects(c.effects,'onPlay',null,p,foe());log(c.name+'を使用！');render();return}combo(i,c,ai)}
function combo(i,c,ai){const p=me(),need=c.kind==='combo3'?3:2;if(p.field.length<need)return alert('必要な仲間が場にいません。');const branch=c.branches.find(b=>matchBranch(b,p.field,need));if(!branch)return alert('成立する合体条件がありません。');let users=chooseUsers(branch,p.field,need);p.hand.splice(i,1);p.discard.push(c.id);for(let n=0;n<branch.sacrifices&&users.length;n++)koUnit(p,users[n],foe(),false);const target=foe().field.slice().sort((a,b)=>a.hp-b.hp)[0];if(target)deal(target,branch.damage,p,foe(),null);applyEffects(branch.effects||[],'onPlay',users[0],p,foe(),users);p.attacks++;log(c.name+'！ '+branch.damage+'ダメージ');fx(c.kind==='combo3'?'3人合体技！':'合体技！');checkEnd();render()}
function matchBranch(b,field,n){if(field.length<n)return false;if(b.any)return true;const ch=(b.characters||'').split(',').map(x=>x.trim()).filter(Boolean),at=(b.attributes||'').split(',').map(x=>x.trim()).filter(Boolean);return ch.every(x=>field.some(u=>u.character===x))&&at.every(x=>field.some(u=>u.attribute===x))}function chooseUsers(b,f,n){const out=[];(b.characters||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{const u=f.find(y=>y.character===x&&!out.includes(y));if(u)out.push(u)});(b.attributes||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{const u=f.find(y=>y.attribute===x&&!out.includes(y));if(u)out.push(u)});f.forEach(u=>{if(out.length<n&&!out.includes(u))out.push(u)});return out.slice(0,n)}
function selectUnit(uid,owner){if(isCPU())return;const p=me(),u=p.field.find(x=>x.uid===uid);if(u){selected=selected===uid?null:uid;render();return}if(selected){const attacker=p.field.find(x=>x.uid===selected),target=foe().field.find(x=>x.uid===uid);if(attacker&&target)attack(attacker,target)}}
function attack(a,t){const p=me();if(p.attacks>=R.attacksPerTurn)return alert('このターンの攻撃回数上限です。');if(game.firstTurn&&game.turn===game.first&&R.firstPlayerAttackLocked)return alert('先攻の最初のターンは攻撃できません。');if(a.status.some(s=>s.type==='attackLock'))return alert('このキャラクターは攻撃できません。');p.attacks++;let dmg=Math.round(attackValue(a)*typeMod(a.attribute,t.attribute));trigger(a,'onAttack',p,foe(),t);deal(t,dmg,p,foe(),a);log(a.name+'の攻撃！ '+dmg+'ダメージ');fx('ATTACK!');selected=null;checkEnd();render()}
function typeMod(a,b){return (a==='rock'&&b==='scissors')||(a==='scissors'&&b==='paper')||(a==='paper'&&b==='rock')?R.typeBonus:(b==='rock'&&a==='scissors')||(b==='scissors'&&a==='paper')||(b==='paper'&&a==='rock')?R.typePenalty:1}function attackValue(u){return Math.max(0,u.attack+u.mods.filter(m=>m.type==='attackUp').reduce((n,m)=>n+m.value,0))}
function deal(t,n,attackerP,defP,source){const guard=defP.field.find(u=>u!==t&&u.status.some(s=>s.type==='guard'));if(guard)t=guard;const red=t.mods.filter(m=>m.type==='reduce').reduce((a,m)=>a+m.value,0);n=Math.max(0,n-red);t.hp-=n;trigger(t,'onDamaged',defP,attackerP,source);const counter=t.status.find(s=>s.type==='counter');if(counter&&source)source.hp-=counter.value;if(t.hp<=0)koUnit(defP,t,attackerP,true)}function koUnit(owner,u,killer,count){trigger(u,'onKO',owner,killer);owner.field.splice(owner.field.indexOf(u),1);owner.discard.push(u.cardId);if(count)killer.ko++;log(u.name+'がKO！');fx('KO!')}
function trigger(u,t,p,e,target){applyEffects(u.effects,t,u,p,e,target)}function applyEffects(list,timing,source,p,e,chosen){(list||[]).filter(x=>x.timing===timing&&conditions(x.conditions,source,p,e)).forEach(x=>effect(x,source,p,e,chosen))}function conditions(cs,s,p,e){return (cs||[]).every(c=>{const v=Number(c.value)||0;if(c.type==='always')return true;if(c.type==='chance')return Math.random()*100<v;if(c.type==='hpBelow')return s&&s.hp/s.maxHp*100<=v;if(c.type==='hpAbove')return s&&s.hp/s.maxHp*100>=v;if(c.type==='allyFieldCount')return p.field.length>=v;if(c.type==='enemyFieldCount')return e.field.length>=v;if(c.type==='handCount')return p.hand.length>=v;if(c.type==='hasAttribute')return p.field.some(u=>u.attribute===c.param);if(c.type==='hasCharacter')return p.field.some(u=>u.character===c.param);return false})}
function targetsFor(x,s,p,e,chosen){if(x.target==='selfActive')return s?[s]:[];if(x.target==='comboUserRandom'){const a=Array.isArray(chosen)?chosen:[];return [a[Math.floor(Math.random()*a.length)]].filter(Boolean)}if(x.target==='allySingle')return [Array.isArray(chosen)?chosen[0]:(chosen||p.field.slice().sort((a,b)=>a.hp-b.hp)[0])].filter(Boolean);if(x.target==='allyAll')return p.field;if(x.target==='enemySingle')return [Array.isArray(chosen)?null:(chosen||e.field.slice().sort((a,b)=>a.hp-b.hp)[0])].filter(Boolean);if(x.target==='enemyAll')return e.field;if(x.target==='randomAlly')return [p.field[Math.floor(Math.random()*p.field.length)]].filter(Boolean);if(x.target==='randomEnemy')return [e.field[Math.floor(Math.random()*e.field.length)]].filter(Boolean);return []}
function effect(x,s,p,e,chosen){let ts=targetsFor(x,s,p,e,chosen),v=Number(x.value)||0,d=Number(x.duration)||0;if(x.type==='draw')draw(x.target==='enemyPlayer'?e:p,v);else if(x.type==='heal'||x.type==='healAll'||x.type==='randomHeal')ts.forEach(u=>u.hp=Math.min(u.maxHp,u.hp+(x.type==='randomHeal'?Math.ceil(Math.random()*v):v)));else if(['attackUp','reduce'].includes(x.type))ts.forEach(u=>u.mods.push({type:x.type,value:v,left:d||1}));else if(['guard','counter','attackLock','status'].includes(x.type))ts.forEach(u=>u.status.push({type:x.type==='status'?(x.param||'status'):x.type,value:v,left:d||1}));else if(x.type==='cleanse')ts.forEach(u=>u.status=[]);else if(x.type==='aoe')e.field.slice().forEach(u=>deal(u,v,p,e,s));else if(x.type==='dot'||x.type==='hot')ts.forEach(u=>u.status.push({type:x.type,value:v,left:d||1}));else if(x.type==='recoil'&&s)deal(s,v,e,p,null);else if(x.type==='randomRecoil'&&s)deal(s,Math.ceil(Math.random()*v),e,p,null);else if(x.type==='discard'){for(let i=0;i<v&&e.hand.length;i++)e.discard.push(e.hand.splice(Math.floor(Math.random()*e.hand.length),1)[0])}else if(x.type==='recoverCard'){for(let i=0;i<v&&p.discard.length;i++)p.hand.push(p.discard.pop())}else if(x.type==='revive'){for(let i=p.discard.length-1;i>=0;i--){const c=C.find(z=>z.id===p.discard[i]);if(c?.kind==='character'&&fieldCost(p)+c.slots<=R.fieldSlots){p.discard.splice(i,1);const u=makeUnit(c);u.hp=Math.min(u.hp,v||Math.ceil(u.maxHp/2));p.field.push(u);break}}}else if(x.type==='search'){const i=p.deck.findIndex(k=>C.find(c=>c.id===k)?.kind===(x.param||'character'));if(i>=0)p.hand.push(p.deck.splice(i,1)[0])}else if(x.type==='swapHP'&&s&&ts[0]){const z=s.hp;s.hp=ts[0].hp;ts[0].hp=z}else if(x.type==='equalizeHP'&&s&&ts[0]){const z=Math.round((s.hp+ts[0].hp)/2);s.hp=ts[0].hp=z}else if(x.type==='conditionalBoost'&&s)s.mods.push({type:'attackUp',value:v,left:d||1});else if(x.type==='rpsDamage')ts.forEach(u=>deal(u,Math.round(v*typeMod(s?.attribute,u.attribute)),p,e,s));else if(x.type==='multiAttack'||x.type==='extraAttack')ts.forEach(u=>deal(u,v||attackValue(s),p,e,s));if(x.cost==='sacrifice1'&&p.field.length)koUnit(p,p.field[0],e,false)}
const coreEffect=effect;effect=function(x,s,p,e,chosen){if(x.type==='recoil'&&x.target==='comboUserRandom'){const t=targetsFor(x,s,p,e,chosen)[0];if(t)deal(t,Number(x.value)||0,e,p,null);return}if(x.type!=='moveDamage')return coreEffect(x,s,p,e,chosen);const t=targetsFor(x,s,p,e,chosen)[0],v=Math.min(Number(x.value)||0,s?Math.max(0,s.maxHp-s.hp):0);if(s&&t&&v){s.hp=Math.min(s.maxHp,s.hp+v);deal(t,v,p,e,s)}};
function tick(p,timing){p.field.slice().forEach(u=>{u.status.slice().forEach(s=>{if(timing==='turnStart'&&s.type==='dot')deal(u,s.value,game.players[1-game.players.indexOf(p)],p,null);if(timing==='turnStart'&&s.type==='hot')u.hp=Math.min(u.maxHp,u.hp+s.value);s.left--;});u.status=u.status.filter(s=>s.left>0);u.mods.forEach(m=>m.left--);u.mods=u.mods.filter(m=>m.left>0);trigger(u,timing,p,game.players[1-game.players.indexOf(p)])})}
function endTurn(){tick(me(),'turnEnd');if(checkEnd())return;game.firstTurn=false;game.turn=1-game.turn;game.turnNo++;selected=null;if(game.mode==='local'){showPass()}else beginTurn()}
function checkEnd(){let winner=null;if(game.players[0].ko>=R.winKO)winner=0;if(game.players[1].ko>=R.winKO)winner=1;game.players.forEach((p,i)=>{if(!p.field.length&&!p.hand.some(k=>C.find(c=>c.id===k)?.kind==='character')&&!p.deck.some(k=>C.find(c=>c.id===k)?.kind==='character'))winner=1-i});if(winner===null)return false;game.winner=winner;store.resume=null;record(winner);saveStore();fx(winner===0?'勝利！':'敗北');setTimeout(()=>show('<h1>'+game.players[winner].name+' WIN!</h1><p>KO '+game.players[winner].ko+'</p><button class="primary" id="homeBtn">ホームへ</button>'),800);return true}
function record(w){if(game.mode==='cpu'){const r=store.records.cpu;r.total++;if(w===0){r.w++;r.streak++;r.best=Math.max(r.best,r.streak);r[game.diff].w++}else{r.l++;r.streak=0;r[game.diff].l++}}else{const r=store.records.local;r.total++;r[w===0?'p1':'p2']++}}
function saveResume(){store.resume=copy(game);saveStore()}function showPass(){root.insertAdjacentHTML('beforeend','<div class="pass"><div><h1>'+me().name+'へ交代</h1><p>相手に手札を見せず端末を渡してください。</p><button class="primary" id="acceptPass">受け取った</button></div></div>')}
function cpuTurn(){if(!isCPU()||game.winner!==null)return;const p=me(),e=foe(),diff=game.diff;let choices=[];p.hand.forEach((k,i)=>{const c=C.find(x=>x.id===k);let score=Math.random()*(diff==='EASY'?100:8);if(c.kind==='character'&&p.summons<R.summonsPerTurn&&fieldCost(p)+c.slots<=R.fieldSlots)score+=30+(diff==='HARD'?c.hp/8+c.attack/3:0);if(c.kind==='support'&&p.supports<R.supportsPerTurn)score+=e.field.length?12:0;if(c.kind.startsWith('combo')&&c.branches.some(b=>matchBranch(b,p.field,c.kind==='combo3'?3:2)))score+=diff==='HARD'?90:45;choices.push({type:'play',i,score})});p.field.forEach(a=>e.field.forEach(t=>{let dmg=Math.round(attackValue(a)*typeMod(a.attribute,t.attribute)),score=20+(dmg>=t.hp?80:0)+(typeMod(a.attribute,t.attribute)>1?25:0)+(diff==='HARD'?(t.attack/2-t.hp/10):0);choices.push({type:'attack',a,t,score:score+Math.random()*8})}));choices.sort((a,b)=>b.score-a.score);const c=diff==='EASY'?choices[Math.floor(Math.random()*choices.length)]:choices[0];if(c?.type==='play'){playCard(c.i,true);setTimeout(cpuTurn,500)}else if(c?.type==='attack'&&p.attacks<R.attacksPerTurn&&!(game.firstTurn&&game.turn===game.first)){attack(c.a,c.t);setTimeout(()=>endTurn(),700)}else setTimeout(()=>endTurn(),400)}
