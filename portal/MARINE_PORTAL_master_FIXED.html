<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARINE PORTAL MASTER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#123}main{max-width:900px;margin:auto;padding:14px}h1{color:#0878bd}.box{background:#fff;border:2px solid #9bd6f4;border-radius:16px;padding:14px;margin:11px 0}input[type=text],textarea{width:100%;padding:10px;border:1px solid #9bd6f4;border-radius:9px;margin:5px 0}textarea{min-height:110px}button{border:0;border-radius:10px;padding:11px 14px;margin:4px;background:#1686c9;color:white;font-weight:900}.danger{background:#b94b4b}.small{font-size:11px;color:#567;line-height:1.6}.row{border-top:1px solid #def;padding:9px 0}.preview{max-width:100%;max-height:130px;object-fit:contain}
</style>
</head>
<body><main>
<h1>🌊 MARINE PORTAL MASTER</h1><div class="small">MASTER更新：2026/09/03 10:52</div>
<div class="box"><h2>⚠️ 注意事項</h2><div class="small">公開版ではデータ保存についての注意をロゴ直下に固定表示します。</div></div>
<div class="box"><h2>🎨 背景・ロゴ</h2><b>背景画像</b><br><input id="bg" type="file" accept="image/*"><div id="bp"></div><br><b>横長ロゴ</b><br><input id="logo" type="file" accept="image/*"><div id="lp"></div></div>
<div class="box"><h2>📢 お知らせ</h2><textarea id="news">新しいコンテンツや更新情報をここに掲載できます！</textarea><input id="date" type="text" value="更新情報は随時追加します"></div>
<div class="box"><h2>🔗 メニュー</h2><div id="menus"></div><button id="add">＋ メニューを追加</button></div>
<div class="box"><h2>📦 書き出し</h2><button id="export">公開用 index.html を書き出す</button><div class="small">背景・ロゴもindex.html内に埋め込みます。</div></div>
</main>
<script>
const TEMPLATE="<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>MARINE PORTAL</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#087eb5 center/cover fixed no-repeat;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"Noto Sans JP\",sans-serif;color:#08324a}.shell{max-width:1050px;margin:auto;padding:14px}.hero{min-height:120px;display:flex;justify-content:center;align-items:center}.logo{max-width:94%;max-height:150px}.fallback{font-size:clamp(34px,8vw,70px);font-weight:900;color:white}.notice,.news{background:rgba(255,255,255,.93);border-radius:18px;padding:14px;margin-bottom:12px}.notice{background:rgba(255,250,220,.96);border:1px solid #e5c45d;font-size:12px;line-height:1.6}.news h2{margin:0 0 8px;color:#0878bd}.newsbody{white-space:pre-wrap}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:rgba(255,255,255,.9);border-radius:20px;padding:15px;min-height:110px;text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px}.ico{font-size:34px}.tile b{display:block;font-size:17px}.tile span{font-size:11px;color:#496b7e}@media(min-width:760px){.menu{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class=\"shell\"><header class=\"hero\">__LOGO__</header><aside class=\"notice\"><b>⚠️ データ保存について</b><br>このサイトの一部データはブラウザ内に保存されます。データは端末・ブラウザごとに異なり、ブラウザのデータ削除、設定変更、端末変更などによって消えることがあります。</aside><section class=\"news\"><h2>📢 お知らせ</h2><div class=\"newsbody\">__NEWS__</div><small>__DATE__</small></section><nav class=\"menu\">__MENU__</nav></div>__BG__</body></html>";
let bg="",logo="";
let data=[
{icon:"🧠",name:"クイズ",desc:"海・健康・お薬などのクイズに挑戦",href:"../quiz/"},
{icon:"🃏",name:"MARINE TRICK",desc:"カードを組んで対戦しよう",href:"../"},
{icon:"🐚",name:"コレクション",desc:"集めたキャラクターやカードを確認",href:"../collection/"},
{icon:"💊",name:"服薬チェック",desc:"毎日の服薬をブラウザに記録",href:"../check/"},
{icon:"🐠",name:"アイコン選択",desc:"お気に入りのキャラクターを選択",href:"../icon/"}
];
const E=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){let r=document.getElementById("menus");r.innerHTML="";data.forEach((m,i)=>{let d=document.createElement("div");d.className="row";d.innerHTML=`<input data-i="${i}" data-k="icon" value="${E(m.icon)}"><input data-i="${i}" data-k="name" value="${E(m.name)}"><input data-i="${i}" data-k="desc" value="${E(m.desc)}"><input data-i="${i}" data-k="href" value="${E(m.href)}"><button class="danger" data-del="${i}">削除</button>`;r.appendChild(d)})}
document.getElementById("menus").oninput=e=>{if(e.target.dataset.i!==undefined)data[+e.target.dataset.i][e.target.dataset.k]=e.target.value};
document.getElementById("menus").onclick=e=>{if(e.target.dataset.del!==undefined){data.splice(+e.target.dataset.del,1);render()}};
document.getElementById("add").onclick=()=>{data.push({icon:"🌊",name:"新しいコンテンツ",desc:"説明を入力",href:"#"});render()};
function img(file,setter,p){if(!file)return;let r=new FileReader();r.onload=()=>{setter(r.result);document.getElementById(p).innerHTML='<img class="preview" src="'+r.result+'">'};r.readAsDataURL(file)}
document.getElementById("bg").onchange=e=>img(e.target.files[0],v=>bg=v,"bp");
document.getElementById("logo").onchange=e=>img(e.target.files[0],v=>logo=v,"lp");
document.getElementById("export").onclick=()=>{
 let menu=data.map(m=>'<a class="tile" href="'+E(m.href)+'"><div class="ico">'+E(m.icon)+'</div><div><b>'+E(m.name)+'</b><span>'+E(m.desc)+'</span></div></a>').join("");
 let lb=logo?'<img class="logo" src="'+logo+'" alt="MARINE PORTAL">':'<div class="fallback">🌊 MARINE PORTAL</div>';
 let bs=bg?'<style>body{background-image:linear-gradient(rgba(0,55,90,.12),rgba(0,35,65,.28)),url("'+bg+'")}</style>':"";
 let out=TEMPLATE.replace("__LOGO__",lb).replace("__NEWS__",E(document.getElementById("news").value)).replace("__DATE__",E(document.getElementById("date").value)).replace("__MENU__",menu).replace("__BG__",bs);
 let u=URL.createObjectURL(new Blob([out],{type:"text/html;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="index.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
};
render();
</script>
</body></html>
