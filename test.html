const DATA=JSON.parse(document.getElementById('game-data').textContent);const KEY='mtc_public_v2_'+DATA.schema;const R=DATA.rules,C=DATA.cards;let store=loadStore(),game=null,view='home',selected=null;
function loadStore(){try{return Object.assign({decks:{},unlocked:[],resume:null,records:{cpu:{total:0,w:0,l:0,streak:0,best:0,EASY:{w:0,l:0},NORMAL:{w:0,l:0},HARD:{w:0,l:0}},local:{total:0,p1:0,p2:0}}},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {decks:{},unlocked:[],resume:null,records:{cpu:{total:0,w:0,l:0,streak:0,best:0,EASY:{w:0,l:0},NORMAL:{w:0,l:0},HARD:{w:0,l:0}},local:{total:0,p1:0,p2:0}}}}}function saveStore(){localStorage.setItem(KEY,JSON.stringify(store))}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const copy=x=>JSON.parse(JSON.stringify(x));const id=()=>Math.random().toString(36).slice(2);const root=document.getElementById('root'),modal=document.getElementById('modal');document.body.style.setProperty('--bg',DATA.branding.background?'url('+DATA.branding.background+')':'none');
function available(){return C.filter(c=>c.unlock==='initial'||store.unlocked.includes(c.id))}function nav(){return '<nav class="nav">'+(DATA.branding.logo?'<img class="logo" src="'+DATA.branding.logo+'">':'<b>MARINE TRICK CARD</b>')+'<button data-view="home">ホーム</button><button data-view="deck">デッキ</button><button data-view="unlock">解放</button><button data-view="record">戦績</button></nav>'}function render(){if(view==='home')home();if(view==='deck')deckEditor();if(view==='unlock')unlockView();if(view==='record')recordView();if(view==='battle')battleView()}
function home(){root.innerHTML=nav()+'<main class="wrap"><section class="box hero"><h1>MARINE TRICK CARD</h1><p>海の仲間と合体技で戦う、1対1カードバトル</p><div class="grid"><button class="primary" data-mode="cpu">CPU対戦</button><button class="primary" data-mode="local">同一端末2人対戦</button>'+(store.resume?'<button class="secondary" id="resume">途中再開</button>':'')+'</div></section><section class="box"><h2>遊び方</h2><p class="hint">20枚のデッキからキャラクターを召喚。通常攻撃、サポート、2人・3人合体技を使い、先に'+R.winKO+'体KOで勝利です。同じキャラクターを重ねるとレベルアップします。</p></section></main>'}
function deckEditor(){const names=Object.keys(store.decks);let active=names[0]||'マイデッキ';let d=store.decks[active]||{};root.innerHTML=nav()+'<main class="wrap"><section class="box"><h2>デッキエディタ</h2><div class="deckline"><span id="deckCount"></span><span id="deckValid"></span></div><div class="grid">'+available().map(c=>'<article class="card" data-card="'+c.id+'">'+(c.image?'<img src="'+c.image+'">':'')+'<span class="kind">'+kind(c.kind)+'</span><h3>'+esc(c.name)+'</h3><small>上限 '+c.limit+'</small><div class="qty"><button data-q="-1">−</button><b>'+(d[c.id]||0)+'</b><button data-q="1">＋</button></div><button class="secondary" data-zoom="'+c.id+'">拡大</button></article>').join('')+'</div><div class="box"><input id="deckName" value="'+esc(active)+'" placeholder="デッキ名"><button class="primary" id="saveDeck">保存</button><select id="deckLoad">'+names.map(n=>'<option>'+esc(n)+'</option>').join('')+'</select><button class="secondary" id="loadDeck">読み込み</button><button class="danger" id="deleteDeck">削除</button></div></section></main>';window.__editDeck={name:active,data:copy(d)};updateDeckLine()}
function updateDeckLine(){const n=Object.values(window.__editDeck.data).reduce((a,b)=>a+b,0),valid=n===R.deckSize&&Object.keys(window.__editDeck.data).some(k=>window.__editDeck.data[k]>0&&C.find(c=>c.id===k)?.kind==='character');document.getElementById('deckCount').textContent=n+' / '+R.deckSize;document.getElementById('deckValid').textContent=valid?'成立 ✓':'未成立';document.getElementById('deckValid').style.color=valid?'#08775d':'#b43a3a'}
function unlockView(){root.innerHTML=nav()+'<main class="wrap"><section class="box"><h2>カード解放</h2><input id="unlockCode" placeholder="解放コード"><button class="primary" id="unlockBtn">解放する</button><p id="unlockMsg"></p></section><section class="box"><div class="grid">'+C.map(c=>'<article class="card '+(available().includes(c)?'':'locked')+'">'+(c.image?'<img src="'+c.image+'">':'')+'<h3>'+esc(available().includes(c)?c.name:'？？？')+'</h3></article>').join('')+'</div></section></main>'}
function recordView(){const x=store.records.cpu,l=store.records.local;root.innerHTML=nav()+'<main class="wrap"><section class="box"><h2>CPU戦績</h2><div class="record"><div>総試合 <b>'+x.total+'</b></div><div>勝 <b>'+x.w+'</b></div><div>負 <b>'+x.l+'</b></div><div>勝率 <b>'+(x.total?Math.round(x.w/x.total*100):0)+'%</b></div><div>現在連勝 <b>'+x.streak+'</b></div><div>最高連勝 <b>'+x.best+'</b></div>'+['EASY','NORMAL','HARD'].map(k=>'<div>'+k+' <b>'+x[k].w+'勝 '+x[k].l+'敗</b></div>').join('')+'</div></section><section class="box"><h2>2人対戦</h2><div class="record"><div>総試合 <b>'+l.total+'</b></div><div>P1勝利 <b>'+l.p1+'</b></div><div>P2勝利 <b>'+l.p2+'</b></div></div></section></main>'}
function chooseMode(mode){const decks=Object.keys(store.decks).filter(n=>deckValid(store.decks[n]));if(!decks.length){alert('成立した保存デッキが必要です。先にデッキを作成してください。');view='deck';render();return}const opts=decks.map(n=>'<option>'+esc(n)+'</option>').join('');show('<h2>'+(mode==='cpu'?'CPU対戦':'2人対戦')+'</h2><label>P1デッキ<select id="p1d">'+opts+'</select></label>'+(mode==='local'?'<label>P2デッキ<select id="p2d">'+opts+'</select></label>':'')+(mode==='cpu'?'<label>難易度<select id="diff"><option>EASY</option><option selected>NORMAL</option><option>HARD</option></select></label>':'')+'<button class="primary" id="start" data-mode="'+mode+'">対戦開始</button>')}
function deckValid(d){return Object.values(d).reduce((a,b)=>a+b,0)===R.deckSize&&Object.keys(d).some(k=>d[k]>0&&C.find(c=>c.id===k)?.kind==='character')}function makeDeck(d){let a=[];Object.entries(d).forEach(([k,n])=>{for(let i=0;i<n;i++)a.push(k)});return shuffle(a)}function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(mode,p1n,p2n,diff){const p1=player('P1',makeDeck(store.decks[p1n]));const p2=player(mode==='cpu'?'CPU':'P2',makeDeck(store.decks[p2n||p1n]));drawInitial(p1);drawInitial(p2);const first=Math.random()<.5?0:1;game={mode,diff,players:[p1,p2],turn:first,turnNo:1,first,firstTurn:true,log:[],winner:null,pending:null};view='battle';fx('対戦開始！');setTimeout(()=>{log(game.players[first].name+'が先攻！');if(mode==='local'){render();showPass()}else beginTurn()},700)}
function player(name,deck){return {name,deck,hand:[],field:[],discard:[],ko:0,summons:0,attacks:0,supports:0,status:[]}}function drawInitial(p){for(let i=0;i<R.initialHand;i++)draw(p,1);if(!p.hand.some(k=>C.find(c=>c.id===k)?.kind==='character')){const i=p.deck.findIndex(k=>C.find(c=>c.id===k)?.kind==='character');if(i>=0){p.deck.push(p.hand.pop());p.hand.push(p.deck.splice(i,1)[0])}}}function draw(p,n){while(n--&&p.deck.length)p.hand.push(p.deck.pop())}
function beginTurn(){const p=me();p.summons=p.attacks=p.supports=0;tick(p,'turnStart');draw(p,R.drawPerTurn);log(p.name+'のターン');saveResume();render();if(isCPU())setTimeout(cpuTurn,650)}function me(){return game.players[game.turn]}function foe(){return game.players[1-game.turn]}function isCPU(){return game.mode==='cpu'&&game.turn===1}
function battleView(){const a=me(),b=foe();root.innerHTML=nav()+'<main class="wrap"><section class="box"><div class="hud"><span class="turn">'+esc(a.name)+' TURN '+game.turnNo+'</span><span>先攻 '+game.players[game.first].name+'</span><span>KO '+game.players[0].ko+' - '+game.players[1].ko+'</span></div></section><section class="battle"><div class="side enemy"><h3>'+esc(b.name)+'　手札 '+b.hand.length+' / 山札 '+b.deck.length+'</h3>'+fieldHTML(b,true)+'</div><div class="side player"><h3>'+esc(a.name)+'　手札 '+a.hand.length+' / 山札 '+a.deck.length+'</h3>'+fieldHTML(a,false)+'<div class="hand">'+a.hand.map((k,i)=>handCard(k,i)).join('')+'</div></div></section><section class="box log">'+game.log.slice(-12).map(x=>'<div>'+esc(x)+'</div>').join('')+'</section><div class="actions"><button class="secondary" id="saveResume">途中セーブ</button><button class="primary" id="endTurn" '+(isCPU()?'disabled':'')+'>ターン終了</button></div></main>'}
function fieldHTML(p,enemy){let slots=[];for(let i=0;i<R.fieldSlots;i++){const u=p.field[i];slots.push(u?'<div class="unit '+(enemy?'enemyUnit':'')+'" data-unit="'+u.uid+'" data-owner="'+game.players.indexOf(p)+'">'+(u.image?'<img src="'+u.image+'">':'')+'<b>'+esc(u.name)+'</b><div class="hpnum">HP '+Math.max(0,u.hp)+' / '+u.maxHp+' Lv.'+u.level+'</div><div class="bar"><i style="width:'+Math.max(0,u.hp/u.maxHp*100)+'%"></i></div><small>'+attr(u.attribute)+' ATK '+attackValue(u)+'</small></div>':'<div class="unit"><span class="hint">空き</span></div>')}return '<div class="field">'+slots.join('')+'</div>'}
function handCard(k,i){const c=C.find(x=>x.id===k);return '<article class="card" data-hand="'+i+'">'+(c.image?'<img src="'+c.image+'">':'')+'<span class="kind">'+kind(c.kind)+'</span><h3>'+esc(c.name)+'</h3><small>'+attr(c.attribute)+' '+(c.kind==='character'?'HP '+c.hp+' / ATK '+c.attack:'')+'</small><button class="secondary" data-play="'+i+'">使う</button><button data-zoom="'+c.id+'">拡大</button></article>'}
function makeUnit(c){return {uid:id(),cardId:c.id,name:c.name,character:c.character,image:c.image,hp:c.hp,maxHp:c.hp,attack:c.attack,attribute:c.attribute,level:1,effects:copy(c.effects),mods:[],status:[]}}function fieldCost(p){return p.field.reduce((n,u)=>n+(C.find(c=>c.id===u.cardId)?.slots||1),0)}
function playCard(i,ai=false){const p=me(),c=C.find(x=>x.id===p.hand[i]);if(!c)return;if(c.kind==='character'){const same=p.field.find(u=>u.character&&u.character===c.character);if(same&&c.levelUp&&same.level<c.maxLevel){p.hand.splice(i,1);same.level++;same.maxHp+=Math.round(c.hp*.25);same.hp+=Math.round(c.hp*.25);same.attack+=Math.round(c.attack*.2);log(c.name+'がLv.'+same.level+'にレベルアップ！');fx('LEVEL UP!');trigger(same,'onSummon',p,foe());render();return}if(p.summons>=R.summonsPerTurn)return alert('このターンは召喚済みです。');if(fieldCost(p)+c.slots>R.fieldSlots)return alert('場の枠が足りません。');p.hand.splice(i,1);const u=makeUnit(c);p.field.push(u);p.summons++;log(c.name+'を召喚！');fx('召喚！');trigger(u,'onSummon',p,foe());render();return}if(c.kind==='support'){if(p.supports>=R.supportsPerTurn)return alert('このターンのサポート使用上限です。');p.hand.splice(i,1);p.discard.push(c.id);p.supports++;applyEffects(c.effects,'onPlay',null,p,foe());log(c.name+'を使用！');render();return}combo(i,c,ai)}
function combo(i,c,ai){const p=me(),need=c.kind==='combo3'?3:2;if(p.field.length<need)return alert('必要な仲間が場にいません。');const branch=c.branches.find(b=>matchBranch(b,p.field,need));if(!branch)return alert('成立する合体条件がありません。');let users=chooseUsers(branch,p.field,need);p.hand.splice(i,1);p.discard.push(c.id);for(let n=0;n<branch.sacrifices&&users.length;n++)koUnit(p,users[n],foe(),false);const target=foe().field.slice().sort((a,b)=>a.hp-b.hp)[0];if(target)deal(target,branch.damage,p,foe(),null);applyEffects(branch.effects||[],'onPlay',users[0],p,foe());p.attacks++;log(c.name+'！ '+branch.damage+'ダメージ');fx(c.kind==='combo3'?'3人合体技！':'合体技！');checkEnd();render()}
function matchBranch(b,field,n){if(field.length<n)return false;if(b.any)return true;const ch=(b.characters||'').split(',').map(x=>x.trim()).filter(Boolean),at=(b.attributes||'').split(',').map(x=>x.trim()).filter(Boolean);return ch.every(x=>field.some(u=>u.character===x))&&at.every(x=>field.some(u=>u.attribute===x))}function chooseUsers(b,f,n){const out=[];(b.characters||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{const u=f.find(y=>y.character===x&&!out.includes(y));if(u)out.push(u)});(b.attributes||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{const u=f.find(y=>y.attribute===x&&!out.includes(y));if(u)out.push(u)});f.forEach(u=>{if(out.length<n&&!out.includes(u))out.push(u)});return out.slice(0,n)}
function selectUnit(uid,owner){if(isCPU())return;const p=me(),u=p.field.find(x=>x.uid===uid);if(u){selected=selected===uid?null:uid;render();return}if(selected){const attacker=p.field.find(x=>x.uid===selected),target=foe().field.find(x=>x.uid===uid);if(attacker&&target)attack(attacker,target)}}
function attack(a,t){const p=me();if(p.attacks>=R.attacksPerTurn)return alert('このターンの攻撃回数上限です。');if(game.firstTurn&&game.turn===game.first&&R.firstPlayerAttackLocked)return alert('先攻の最初のターンは攻撃できません。');if(a.status.some(s=>s.type==='attackLock'))return alert('このキャラクターは攻撃できません。');p.attacks++;let dmg=Math.round(attackValue(a)*typeMod(a.attribute,t.attribute));trigger(a,'onAttack',p,foe(),t);deal(t,dmg,p,foe(),a);log(a.name+'の攻撃！ '+dmg+'ダメージ');fx('ATTACK!');selected=null;checkEnd();render()}
function typeMod(a,b){return (a==='rock'&&b==='scissors')||(a==='scissors'&&b==='paper')||(a==='paper'&&b==='rock')?R.typeBonus:(b==='rock'&&a==='scissors')||(b==='scissors'&&a==='paper')||(b==='paper'&&a==='rock')?R.typePenalty:1}function attackValue(u){return Math.max(0,u.attack+u.mods.filter(m=>m.type==='attackUp').reduce((n,m)=>n+m.value,0))}
function deal(t,n,attackerP,defP,source){const guard=defP.field.find(u=>u!==t&&u.status.some(s=>s.type==='guard'));if(guard)t=guard;const red=t.mods.filter(m=>m.type==='reduce').reduce((a,m)=>a+m.value,0);n=Math.max(0,n-red);t.hp-=n;trigger(t,'onDamaged',defP,attackerP,source);const counter=t.status.find(s=>s.type==='counter');if(counter&&source)source.hp-=counter.value;if(t.hp<=0)koUnit(defP,t,attackerP,true)}function koUnit(owner,u,killer,count){trigger(u,'onKO',owner,killer);owner.field.splice(owner.field.indexOf(u),1);owner.discard.push(u.cardId);if(count)killer.ko++;log(u.name+'がKO！');fx('KO!')}
function trigger(u,t,p,e,target){applyEffects(u.effects,t,u,p,e,target)}function applyEffects(list,timing,source,p,e,chosen){(list||[]).filter(x=>x.timing===timing&&conditions(x.conditions,source,p,e)).forEach(x=>effect(x,source,p,e,chosen))}function conditions(cs,s,p,e){return (cs||[]).every(c=>{const v=Number(c.value)||0;if(c.type==='always')return true;if(c.type==='chance')return Math.random()*100<v;if(c.type==='hpBelow')return s&&s.hp/s.maxHp*100<=v;if(c.type==='hpAbove')return s&&s.hp/s.maxHp*100>=v;if(c.type==='allyFieldCount')return p.field.length>=v;if(c.type==='enemyFieldCount')return e.field.length>=v;if(c.type==='handCount')return p.hand.length>=v;if(c.type==='hasAttribute')return p.field.some(u=>u.attribute===c.param);if(c.type==='hasCharacter')return p.field.some(u=>u.character===c.param);return false})}
function targetsFor(x,s,p,e,chosen){if(x.target==='selfActive')return s?[s]:[];if(x.target==='allySingle')return [chosen||p.field.slice().sort((a,b)=>a.hp-b.hp)[0]].filter(Boolean);if(x.target==='allyAll')return p.field;if(x.target==='enemySingle')return [chosen||e.field.slice().sort((a,b)=>a.hp-b.hp)[0]].filter(Boolean);if(x.target==='enemyAll')return e.field;if(x.target==='randomAlly')return [p.field[Math.floor(Math.random()*p.field.length)]].filter(Boolean);if(x.target==='randomEnemy')return [e.field[Math.floor(Math.random()*e.field.length)]].filter(Boolean);return []}
function effect(x,s,p,e,chosen){let ts=targetsFor(x,s,p,e,chosen),v=Number(x.value)||0,d=Number(x.duration)||0;if(x.type==='draw')draw(x.target==='enemyPlayer'?e:p,v);else if(x.type==='heal'||x.type==='healAll'||x.type==='randomHeal')ts.forEach(u=>u.hp=Math.min(u.maxHp,u.hp+(x.type==='randomHeal'?Math.ceil(Math.random()*v):v)));else if(['attackUp','reduce'].includes(x.type))ts.forEach(u=>u.mods.push({type:x.type,value:v,left:d||1}));else if(['guard','counter','attackLock','status'].includes(x.type))ts.forEach(u=>u.status.push({type:x.type==='status'?(x.param||'status'):x.type,value:v,left:d||1}));else if(x.type==='cleanse')ts.forEach(u=>u.status=[]);else if(x.type==='aoe')e.field.slice().forEach(u=>deal(u,v,p,e,s));else if(x.type==='dot'||x.type==='hot')ts.forEach(u=>u.status.push({type:x.type,value:v,left:d||1}));else if(x.type==='recoil'&&s)deal(s,v,e,p,null);else if(x.type==='randomRecoil'&&s)deal(s,Math.ceil(Math.random()*v),e,p,null);else if(x.type==='discard'){for(let i=0;i<v&&e.hand.length;i++)e.discard.push(e.hand.splice(Math.floor(Math.random()*e.hand.length),1)[0])}else if(x.type==='recoverCard'){for(let i=0;i<v&&p.discard.length;i++)p.hand.push(p.discard.pop())}else if(x.type==='revive'){for(let i=p.discard.length-1;i>=0;i--){const c=C.find(z=>z.id===p.discard[i]);if(c?.kind==='character'&&fieldCost(p)+c.slots<=R.fieldSlots){p.discard.splice(i,1);const u=makeUnit(c);u.hp=Math.min(u.hp,v||Math.ceil(u.maxHp/2));p.field.push(u);break}}}else if(x.type==='search'){const i=p.deck.findIndex(k=>C.find(c=>c.id===k)?.kind===(x.param||'character'));if(i>=0)p.hand.push(p.deck.splice(i,1)[0])}else if(x.type==='swapHP'&&s&&ts[0]){const z=s.hp;s.hp=ts[0].hp;ts[0].hp=z}else if(x.type==='equalizeHP'&&s&&ts[0]){const z=Math.round((s.hp+ts[0].hp)/2);s.hp=ts[0].hp=z}else if(x.type==='conditionalBoost'&&s)s.mods.push({type:'attackUp',value:v,left:d||1});else if(x.type==='rpsDamage')ts.forEach(u=>deal(u,Math.round(v*typeMod(s?.attribute,u.attribute)),p,e,s));else if(x.type==='multiAttack'||x.type==='extraAttack')ts.forEach(u=>deal(u,v||attackValue(s),p,e,s));if(x.cost==='sacrifice1'&&p.field.length)koUnit(p,p.field[0],e,false)}
const coreEffect=effect;effect=function(x,s,p,e,chosen){if(x.type!=='moveDamage')return coreEffect(x,s,p,e,chosen);const t=targetsFor(x,s,p,e,chosen)[0],v=Math.min(Number(x.value)||0,s?Math.max(0,s.maxHp-s.hp):0);if(s&&t&&v){s.hp=Math.min(s.maxHp,s.hp+v);deal(t,v,p,e,s)}};
function tick(p,timing){p.field.slice().forEach(u=>{u.status.slice().forEach(s=>{if(timing==='turnStart'&&s.type==='dot')deal(u,s.value,game.players[1-game.players.indexOf(p)],p,null);if(timing==='turnStart'&&s.type==='hot')u.hp=Math.min(u.maxHp,u.hp+s.value);s.left--;});u.status=u.status.filter(s=>s.left>0);u.mods.forEach(m=>m.left--);u.mods=u.mods.filter(m=>m.left>0);trigger(u,timing,p,game.players[1-game.players.indexOf(p)])})}
function endTurn(){tick(me(),'turnEnd');if(checkEnd())return;game.firstTurn=false;game.turn=1-game.turn;game.turnNo++;selected=null;if(game.mode==='local'){showPass()}else beginTurn()}
function checkEnd(){let winner=null;if(game.players[0].ko>=R.winKO)winner=0;if(game.players[1].ko>=R.winKO)winner=1;game.players.forEach((p,i)=>{if(!p.field.length&&!p.hand.some(k=>C.find(c=>c.id===k)?.kind==='character')&&!p.deck.some(k=>C.find(c=>c.id===k)?.kind==='character'))winner=1-i});if(winner===null)return false;game.winner=winner;store.resume=null;record(winner);saveStore();fx(winner===0?'勝利！':'敗北');setTimeout(()=>show('<h1>'+game.players[winner].name+' WIN!</h1><p>KO '+game.players[winner].ko+'</p><button class="primary" id="homeBtn">ホームへ</button>'),800);return true}
function record(w){if(game.mode==='cpu'){const r=store.records.cpu;r.total++;if(w===0){r.w++;r.streak++;r.best=Math.max(r.best,r.streak);r[game.diff].w++}else{r.l++;r.streak=0;r[game.diff].l++}}else{const r=store.records.local;r.total++;r[w===0?'p1':'p2']++}}
function saveResume(){store.resume=copy(game);saveStore()}function showPass(){root.insertAdjacentHTML('beforeend','<div class="pass"><div><h1>'+me().name+'へ交代</h1><p>相手に手札を見せず端末を渡してください。</p><button class="primary" id="acceptPass">受け取った</button></div></div>')}
function cpuTurn(){if(!isCPU()||game.winner!==null)return;const p=me(),e=foe(),diff=game.diff;let choices=[];p.hand.forEach((k,i)=>{const c=C.find(x=>x.id===k);let score=Math.random()*(diff==='EASY'?100:8);if(c.kind==='character'&&p.summons<R.summonsPerTurn&&fieldCost(p)+c.slots<=R.fieldSlots)score+=30+(diff==='HARD'?c.hp/8+c.attack/3:0);if(c.kind==='support'&&p.supports<R.supportsPerTurn)score+=e.field.length?12:0;if(c.kind.startsWith('combo')&&c.branches.some(b=>matchBranch(b,p.field,c.kind==='combo3'?3:2)))score+=diff==='HARD'?90:45;choices.push({type:'play',i,score})});p.field.forEach(a=>e.field.forEach(t=>{let dmg=Math.round(attackValue(a)*typeMod(a.attribute,t.attribute)),score=20+(dmg>=t.hp?80:0)+(typeMod(a.attribute,t.attribute)>1?25:0)+(diff==='HARD'?(t.attack/2-t.hp/10):0);choices.push({type:'attack',a,t,score:score+Math.random()*8})}));choices.sort((a,b)=>b.score-a.score);const c=diff==='EASY'?choices[Math.floor(Math.random()*choices.length)]:choices[0];if(c?.type==='play'){playCard(c.i,true);setTimeout(cpuTurn,500)}else if(c?.type==='attack'&&p.attacks<R.attacksPerTurn&&!(game.firstTurn&&game.turn===game.first)){attack(c.a,c.t);setTimeout(()=>endTurn(),700)}else setTimeout(()=>endTurn(),400)}
function log(s){game.log.push(s)}function fx(s){const d=document.createElement('div');d.className='fx';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}function show(html){modal.innerHTML='<div class="modalBox">'+html+'</div>';modal.classList.remove('hide')}function close(){modal.classList.add('hide');modal.innerHTML=''}function kind(k){return {character:'キャラ',support:'サポート',combo2:'2人合体',combo3:'3人合体'}[k]}function attr(a){return {rock:'✊',scissors:'✌️',paper:'✋',none:'—'}[a]||a}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.mode){chooseMode(b.dataset.mode);return}if(b.id==='start'){startGame(b.dataset.mode,document.getElementById('p1d').value,document.getElementById('p2d')?.value,document.getElementById('diff')?.value||'NORMAL');close();return}if(b.id==='resume'){game=store.resume;view='battle';render();return}if(b.dataset.zoom){const c=C.find(x=>x.id===b.dataset.zoom);show((c.image?'<img src="'+c.image+'">':'')+'<h2>'+esc(c.name)+'</h2><p>'+kind(c.kind)+' '+attr(c.attribute)+'</p><button class="secondary" id="closeModal">閉じる</button>');return}if(b.id==='closeModal'){close();return}if(b.dataset.q){const art=b.closest('[data-card]'),c=C.find(x=>x.id===art.dataset.card),d=window.__editDeck.data,n=Math.max(0,Math.min(c.limit,(d[c.id]||0)+Number(b.dataset.q)));if(n)d[c.id]=n;else delete d[c.id];art.querySelector('.qty b').textContent=n;updateDeckLine();return}if(b.id==='saveDeck'){const n=document.getElementById('deckName').value.trim()||'マイデッキ';if(!deckValid(window.__editDeck.data))return alert('デッキ枚数とキャラクターを確認してください。');store.decks[n]=copy(window.__editDeck.data);saveStore();alert('デッキを保存しました。');render();return}if(b.id==='loadDeck'){const n=document.getElementById('deckLoad').value;if(n){const d=store.decks[n];window.__editDeck={name:n,data:copy(d)};document.getElementById('deckName').value=n;render()};return}if(b.id==='deleteDeck'){const n=document.getElementById('deckLoad').value;if(n&&confirm(n+'を削除しますか？')){delete store.decks[n];saveStore();render()}return}if(b.id==='unlockBtn'){const code=document.getElementById('unlockCode').value.trim();const hit=C.filter(c=>c.unlock==='code'&&c.code===code&&!store.unlocked.includes(c.id));hit.forEach(c=>store.unlocked.push(c.id));saveStore();document.getElementById('unlockMsg').textContent=hit.length?hit.map(c=>c.name).join('、')+'を解放しました！':'一致する未解放カードはありません。';return}if(b.dataset.play!==undefined){playCard(Number(b.dataset.play));return}if(b.id==='endTurn'){endTurn();return}if(b.id==='saveResume'){saveResume();alert('途中セーブしました。');return}if(b.id==='acceptPass'){document.querySelector('.pass').remove();beginTurn();return}if(b.id==='homeBtn'){close();view='home';render();return}const u=b.closest('[data-unit]');if(u)selectUnit(u.dataset.unit,Number(u.dataset.owner))});document.addEventListener('click',e=>{const u=e.target.closest('[data-unit]');if(u&&!e.target.closest('button'))selectUnit(u.dataset.unit,Number(u.dataset.owner))});render();
})()</script></body></html>
