<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>MARINE TRICK 試作版</title><style>
:root{--b:#0878bd;--bg:#eefaff;--ink:#123;--orange:#f39a32}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;background:linear-gradient(#dff6ff,#fff);color:var(--ink)}header{padding:14px;text-align:center;background:white;border-bottom:3px solid var(--b)}h1{margin:0;color:var(--b);font-size:28px}.sub{font-size:12px}.game{max-width:1000px;margin:auto;padding:12px}.status{display:flex;justify-content:space-between;gap:8px;margin:8px 0}.pill{background:white;border:2px solid var(--b);border-radius:20px;padding:7px 12px;font-weight:700}.board{background:#bdeeff;border:3px solid var(--b);border-radius:18px;padding:12px;margin:10px 0}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:white;border:3px solid #49a9d9;border-radius:14px;padding:9px;min-height:150px;position:relative;box-shadow:0 3px 0 #87cfe9}.card.empty{opacity:.45;display:grid;place-items:center}.name{font-weight:900;font-size:18px}.hp{font-weight:900;color:#e34d4d}.bar{height:10px;background:#ddd;border-radius:9px;overflow:hidden;margin:5px 0}.bar>i{display:block;height:100%;background:#49b96e}.move{font-size:13px;margin-top:8px}.tag{display:inline-block;background:#fff1d8;border:1px solid #eaa95c;border-radius:8px;padding:2px 6px;font-size:11px}.hand{display:flex;gap:7px;overflow-x:auto;padding:8px 2px}.hand button,.actions button{border:2px solid var(--b);background:white;border-radius:12px;padding:10px;font-weight:800;cursor:pointer}.hand button{min-width:110px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions button.primary{background:var(--b);color:white}.actions button.combo{background:#fff0d8;border-color:var(--orange)}button:disabled{opacity:.35}.log{background:#fff;border:2px dashed #7fc5e7;border-radius:12px;padding:10px;min-height:75px;font-size:13px;max-height:130px;overflow:auto}.enemy .card{border-color:#e98f8f}.enemy.board{background:#ffe5e5;border-color:#dd7373}.selected{outline:5px solid #ffd64a}.ko{filter:grayscale(1);opacity:.35}.targetBtn{margin-top:8px;width:100%;border:2px solid #dd7373;background:#fff4f4;border-radius:9px;padding:7px;font-weight:800}.help{font-size:12px;background:white;border-radius:12px;padding:9px;margin-top:8px}@media(max-width:600px){.card{min-height:135px;padding:7px}.name{font-size:15px}.game{padding:7px}}
</style></head><body><header><h1>🐚＋ MARINE TRICK</h1><div class='sub'>エネルギーなし・3体盤面・合体技中心の試作版</div></header><main class='game'>
<div class='status'><div class='pill' id='turn'>あなたのターン</div><div class='pill'>撃破数 <span id='score'>0</span> - <span id='cpuScore'>0</span></div><button onclick='resetGame()'>最初から</button></div>
<section class='enemy board'><b>CPUの場</b><div class='row' id='enemyBoard'></div></section>
<section class='board'><b>あなたの場</b><div class='row' id='playerBoard'></div><div class='actions' id='actions'></div></section>
<b>手札 <small>（1ターンにキャラ1体まで場に出せる）</small></b><div class='hand' id='hand'></div>
<div class='log' id='log'></div><div class='help'><b>遊び方：</b> ①手札からキャラを1体出す → ②自分の技を押す → ③CPU側の「このキャラを攻撃」を押す → ④ターン終了。<br><br>基本：HP120。通常攻撃はキャラごとに10〜30。2人技は約60、3人技は大技。1ターンに攻撃は1回。今回は試遊しやすいようCPU戦・固定デッキにしています。</div>
</main><script>
const baseChars=[
{id:'A',name:'マロン',hp:120,atk:30,recoil:10,move:'たいあたり',memo:'30ダメージ／自分にも10'},
{id:'B',name:'ルウ',hp:120,atk:20,recoil:0,move:'ひかりアタック',memo:'20ダメージ'},
{id:'C',name:'タケシ',hp:120,atk:10,recoil:-10,move:'ひと休みパンチ',memo:'10ダメージ／自分10回復'}];
let state;
function clone(c){return {...c,cur:c.hp,uid:Math.random().toString(36).slice(2)}}
function resetGame(){state={deck:[...baseChars,...baseChars].sort(()=>Math.random()-.5),hand:[],p:[],e:baseChars.map(clone),turn:1,played:false,attacked:false,score:0,cpuScore:0,skip:false}; for(let i=0;i<4;i++)draw(); log('ゲーム開始！ キャラを場に出して攻撃しよう。',true); render()}
function draw(){if(state.deck.length)state.hand.push(clone(state.deck.pop()))}
function log(t,clear=false){let el=document.getElementById('log'); if(clear)el.innerHTML=''; el.innerHTML=`<div>▶ ${t}</div>`+el.innerHTML}
function renderCard(c,enemy=false,i=0){if(!c)return `<div class='card empty'>空き</div>`;let pct=Math.max(0,c.cur/c.hp*100);return `<div class='card ${c.cur<=0?'ko':''}'><div class='name'>${c.name}</div><div class='hp'>HP ${Math.max(0,c.cur)}/${c.hp}</div><div class='bar'><i style='width:${pct}%'></i></div><span class='tag'>${c.move}</span><div class='move'>${c.memo}</div>${enemy && c.cur>0 ? `<button class='targetBtn' onclick='target(${i})'>このキャラを攻撃</button>` : ''}</div>`}
function render(){document.getElementById('playerBoard').innerHTML=[0,1,2].map(i=>renderCard(state.p[i])).join('');document.getElementById('enemyBoard').innerHTML=[0,1,2].map(i=>renderCard(state.e[i],true,i)).join('');document.getElementById('hand').innerHTML=state.hand.map((c,i)=>`<button onclick='play(${i})' ${state.played||state.p.length>=3?'disabled':''}>${c.name}<br>HP120</button>`).join('')||'<small>手札なし</small>';let alive=state.p.filter(x=>x.cur>0);let a=document.getElementById('actions');a.innerHTML='';alive.forEach((c,i)=>a.innerHTML+=`<button class='primary' onclick='chooseAttack(${i})' ${state.attacked||state.skip?'disabled':''}>${c.name}：${c.move} ${c.atk}</button>`);if(alive.length>=2)a.innerHTML+=`<button class='combo' onclick='combo2()' ${state.attacked||state.skip?'disabled':''}>🤝 2人合体 60</button>`;if(alive.length>=3)a.innerHTML+=`<button class='combo' onclick='combo3()' ${state.attacked||state.skip?'disabled':''}>🌟 3人合体 110</button>`;a.innerHTML+=`<button onclick='heal()'>💧いやし +20</button><button onclick='endTurn()'>ターン終了</button>`;document.getElementById('score').textContent=state.score;document.getElementById('cpuScore').textContent=state.cpuScore;document.getElementById('turn').textContent=state.skip?'あなたのターン（攻撃休み）':'あなたのターン'}
function play(i){if(state.played||state.p.length>=3)return;state.p.push(state.hand.splice(i,1)[0]);state.played=true;log(`${state.p[state.p.length-1].name}を場に出した！`);render()}
let pending=null;function chooseAttack(i){pending={type:'single',i};log('攻撃する相手を選んで！')};function combo2(){pending={type:'two'};log('2人合体！ 攻撃する相手を選んで！')};function combo3(){pending={type:'three'};log('3人合体技！ 攻撃する相手を選んで！')}
function target(i){if(!pending){log('先に自分の攻撃・2人技・3人技を選んで！');return;}if(state.attacked||state.skip||!state.e[i]||state.e[i].cur<=0)return;let dmg=0;if(pending.type==='single'){let c=state.p.filter(x=>x.cur>0)[pending.i];if(!c)return;dmg=c.atk;if(c.recoil>0)c.cur-=c.recoil;if(c.recoil<0)c.cur=Math.min(c.hp,c.cur-c.recoil);log(`${c.name}の${c.move}！ ${dmg}ダメージ！`)}if(pending.type==='two'){dmg=60;let a=state.p.filter(x=>x.cur>0);a[0].cur-=10;log(`2人合体技！ ${dmg}ダメージ！ 参加キャラ1体に10反動！`)}if(pending.type==='three'){dmg=110;log(`3人合体技！！ ${dmg}ダメージ！`)}state.e[i].cur-=dmg;pending=null;state.attacked=true;cleanup();render()}
function heal(){let c=state.p.find(x=>x.cur>0&&x.cur<x.hp);if(!c){log('回復できるキャラがいない。');return}c.cur=Math.min(c.hp,c.cur+20);log(`${c.name}を20回復！`);render()}
function cleanup(){state.e.forEach(c=>{if(c.cur<=0&&!c.counted){c.counted=true;state.score++;log(`${c.name}を倒した！`)}});state.p.forEach(c=>{if(c.cur<=0&&!c.counted){c.counted=true;state.cpuScore++;log(`${c.name}が倒された！`)}});state.e=state.e.filter(c=>c.cur>0);state.p=state.p.filter(c=>c.cur>0);checkWin()}
function checkWin(){if(state.score>=3){alert('勝ち！ 🎉');return true}if(state.cpuScore>=3){alert('CPUの勝ち！');return true}return false}
function endTurn(){if(checkWin())return;cpuTurn();state.turn++;state.played=false;state.attacked=false;state.skip=false;draw();render()}
function cpuTurn(){let pa=state.p.filter(x=>x.cur>0);let ea=state.e.filter(x=>x.cur>0);if(!pa.length||!ea.length)return;let target=pa.sort((a,b)=>a.cur-b.cur)[0];let dmg=ea.length>=3?110:ea.length>=2?60:ea[0].atk;target.cur-=dmg;log(`CPUの${ea.length>=3?'3人合体技':ea.length>=2?'2人合体技':ea[0].move}！ ${dmg}ダメージ！`);cleanup()}
resetGame();
</script></body></html>
